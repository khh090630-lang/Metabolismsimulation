<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>대사과정 완벽 시뮬레이터 (세포호흡 & 광합성)</title>
    <style>
        :root {
            --bg: #1e272e;
            --panel: #2f3640;
            --primary: #0fb9b1; /* 세포호흡 컬러 */
            --photo: #27ae60;   /* 광합성 컬러 */
            --accent: #eb3b5a;
            --atom-c: #4b6584;
            --atom-o: #eb3b5a;
            --atom-h: #d1d8e0;
            --atom-p: #f7b731;
            --atom-s: #f39c12;
            --co2-col: #7f8c8d;
        }
        * { box-sizing: border-box; font-family: 'Pretendard', sans-serif; }
        body { margin: 0; background: var(--bg); color: #f5f6fa; display: flex; flex-direction: column; height: 100vh; overflow-y: auto; overflow-x: hidden; }
        
        header { background: #111; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.5); z-index: 1000; flex-shrink: 0; border-bottom: 2px solid #333; }
        header h1 { margin: 0; font-size: 1.5rem; display: flex; gap: 10px; font-weight: 800; }
        .h-resp { color: var(--primary); }
        .h-photo { color: var(--photo); }
        .home-btn { background: rgba(255,255,255,0.1); color: white; border: 1px solid #555; padding: 0.5rem 1rem; border-radius: 5px; cursor: pointer; transition: 0.2s; font-weight: bold; z-index: 1001; }
        .home-btn:hover { background: white; color: black; }
        
        #app { flex: 1; display: flex; flex-direction: column; padding: 1.5rem 2rem; width: 100%; max-width: 1400px; margin: 0 auto; }
        .screen { display: none; width: 100%; flex-direction: column; animation: fadeIn 0.3s; }
        .screen.active { display: flex; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* 메인 및 서브 메뉴 */
        .menu-wrapper { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 75vh; }
        .main-title { font-size: 2.5rem; margin-bottom: 3rem; text-align: center; }
        .menu-grid { display: flex; gap: 2rem; justify-content: center; flex-wrap: wrap; margin-bottom: 2rem; }
        .menu-card { background: var(--panel); padding: 3rem 2rem; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.4); text-align: center; cursor: pointer; border: 2px solid transparent; width: 330px; transition: 0.2s; position: relative; overflow: hidden; }
        .menu-card:hover { transform: translateY(-5px); background: #353b48; }
        .card-resp:hover { border-color: var(--primary); }
        .card-photo:hover { border-color: var(--photo); }
        .sub-btn { display: block; width: 100%; padding: 1.2rem; margin-bottom: 1rem; background: #111; color: white; border: 2px solid #555; border-radius: 10px; font-size: 1.2rem; font-weight: bold; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .sub-btn.btn-resp:hover { border-color: var(--primary); color: var(--primary); transform: scale(1.02); }
        .sub-btn.btn-photo:hover { border-color: var(--photo); color: var(--photo); transform: scale(1.02); }

        /* 시뮬레이터 뼈대 */
        .sim-header { background: var(--panel); padding: 1rem 2rem; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; flex-shrink: 0; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .progress-bar { flex: 1; height: 10px; background: #111; margin: 0 2rem; border-radius: 5px; overflow: hidden; }
        .progress-fill { height: 100%; width: 0%; transition: 0.3s; }
        .fill-resp { background: var(--primary); }
        .fill-photo { background: var(--photo); }
        
        .sim-body { display: flex; gap: 1rem; flex: 1; min-height: 600px; position: relative; }
        
        /* 시각화 컨테이너 */
        .visual-area { flex: 2; min-width: 800px; background: #0b0e14; border-radius: 15px; border: 2px solid #444; display: flex; flex-direction: column; box-shadow: inset 0 0 50px rgba(0,0,0,0.8); position: relative; overflow: hidden; margin-bottom: 1rem; }
        .views-container { flex: 1; position: relative; display: flex; align-items: center; justify-content: center; padding: 2rem; overflow: hidden; padding-bottom: 90px; }
        
        /* 터치 버그 완전 해결: 최상단 z-index 부여 및 포인터 이벤트 활성화 */
        .nav-controls { position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); background: rgba(11, 14, 20, 0.95); padding: 10px 25px; display: flex; justify-content: center; gap: 20px; border: 2px solid #555; border-radius: 50px; box-shadow: 0 10px 30px rgba(0,0,0,0.7); z-index: 99999; backdrop-filter: blur(5px); pointer-events: auto; }
        .nav-btn { background: var(--panel); color: white; border: 2px solid #666; border-radius: 30px; padding: 0.6rem 2.5rem; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.3); pointer-events: auto; }
        .nav-btn:hover:not(:disabled) { background: #555; }
        .nav-btn.btn-resp:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); }
        .nav-btn.btn-photo:hover:not(:disabled) { border-color: var(--photo); color: var(--photo); }
        .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; pointer-events: none; }
        .replay-btn { background: #f1c40f; color: #111; border: none; }

        /* 완벽한 루이스 구조식 Grid-Flex 시스템 */
        .reaction-view { display: flex; width: 100%; align-items: center; justify-content: center; gap: 2rem; position: relative; z-index: 10; padding-bottom: 2rem; }
        .mol-box { background: #2f3542; padding: 1.5rem; border-radius: 15px; border: 1px solid #555; display: flex; flex-direction: column; align-items: center; min-width: 320px; z-index: 10; transition: opacity 0.5s, transform 0.5s; box-shadow: 0 10px 20px rgba(0,0,0,0.4); }
        .mol-name { font-weight: bold; background: #111; padding: 0.5rem 1.5rem; border-radius: 20px; margin-bottom: 1.5rem; border: 1px solid #444; text-align: center; font-size: 1.1rem; }
        .name-resp { color: var(--primary); }
        .name-photo { color: var(--photo); }
        .mol-name.prod { color: var(--secondary); border-color: var(--secondary); }
        
        .m-row { display: flex; justify-content: center; align-items: center; height: 32px; width: 100%; }
        .m-vrow { display: flex; justify-content: center; align-items: center; height: 18px; width: 100%; }
        .mol-l { width: 110px; display: flex; justify-content: flex-end; align-items: center; position: relative; }
        .mol-r { width: 110px; display: flex; justify-content: flex-start; align-items: center; position: relative; }
        .mol-c { width: 34px; position: relative; display: flex; justify-content: center; align-items: center; z-index: 2; }
        
        /* 개별 원자 동그라미 스타일 */
        .atom { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 12px; z-index: 5; box-shadow: inset -1px -2px 4px rgba(0,0,0,0.4); position: relative; }
        .atom.C { background: var(--atom-c); color: white; border: 1px solid #333; }
        .atom.O { background: var(--atom-o); color: white; border: 1px solid #333; }
        .atom.H { background: var(--atom-h); color: #222; border: 1px solid #999; }
        .atom.P { background: var(--atom-p); color: #111; box-shadow: 0 0 10px rgba(247,183,49,0.8); border: 1px solid #d35400; }
        .atom.S { background: var(--atom-s); color: white; border: 1px solid #333; }
        .atom.CoA { background: #8e44ad; color: white; width: 40px; border-radius: 8px; font-size: 10px; border: 1px solid #333; }
        .atom.COO { background: var(--co2-col); color: white; width: 45px; border-radius: 8px; font-size: 10px; border: 1px solid #333; }

        .bond { position: absolute; background: #8395a7; z-index: 1; }
        .bond.h { width: 20px; height: 4px; }
        .bond.hd { width: 20px; height: 10px; border-top: 3px solid #8395a7; border-bottom: 3px solid #8395a7; background: transparent; }
        .bond.v { height: 18px; width: 4px; }
        .bond.vd { height: 18px; width: 10px; border-left: 3px solid #8395a7; border-right: 3px solid #8395a7; background: transparent; }

        .arrow-wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 160px; z-index: 5; position: relative; }
        .enz-tag { background: #111; color: #f1c40f; padding: 0.8rem; border-radius: 10px; font-size: 0.95rem; font-weight: bold; text-align: center; border: 1px solid #f1c40f; box-shadow: 0 4px 10px rgba(0,0,0,0.5); z-index: 10; width: 130%; white-space: pre-wrap; line-height: 1.4; }
        .arrow-line { font-size: 3.5rem; color: #555; margin: -10px 0; }

        /* 블록형 애니메이션 에셋 */
        #anim-layer { position: absolute; inset: 0; pointer-events: none; z-index: 40; overflow: hidden; }
        .anim-group { position: absolute; display: flex; align-items: center; gap: 3px; opacity: 0; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5)); transform: translate(-50%, -50%); z-index: 45;}
        .a-base { padding: 6px 12px; border-radius: 6px; font-weight: bold; color: white; font-size: 13px; border: 1px solid rgba(255,255,255,0.3); display: flex; align-items: center; justify-content: center; }
        .a-ad { background: #2980b9; }
        .a-nad { background: #8e44ad; }
        .a-fad { background: #16a085; }
        .a-coa { background: #34495e; }
        .a-co2 { background: var(--co2-col); }
        .a-h2o { background: #3498db; }
        .a-o2 { background: #e74c3c; border-radius: 50%; width: 40px; height: 40px; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 14px; border: 2px solid white; box-shadow: 0 0 10px rgba(231,76,60,0.8); }
        .p-ball { width: 22px; height: 22px; border-radius: 50%; background: var(--atom-p); color: #111; display: flex; justify-content: center; align-items: center; font-size: 11px; font-weight: bold; border: 1px solid #d35400; }
        
        /* 물리적 파티클 */
        .fly-p { position: absolute; width: 22px; height: 22px; border-radius: 50%; background: var(--atom-p); z-index: 45; display: flex; justify-content: center; align-items: center; font-size: 11px; font-weight: bold; color: #111; transform: translate(-50%, -50%); box-shadow: 0 0 10px rgba(247,183,49,0.8); border: 1px solid #d35400; }
        .fly-e { position: absolute; width: 14px; height: 14px; border-radius: 50%; background: #f1c40f; color: black; z-index: 45; display: flex; justify-content: center; align-items: center; font-size: 8px; font-weight: bold; box-shadow: 0 0 10px yellow; transform: translate(-50%, -50%); }
        .fly-h { position: absolute; width: 16px; height: 16px; border-radius: 50%; background: #00a8ff; color: white; z-index: 45; display: flex; justify-content: center; align-items: center; font-size: 9px; font-weight: bold; transform: translate(-50%, -50%); border: 1px solid white; box-shadow: 0 0 8px #00a8ff; }
        .fly-light { position: absolute; width: 30px; height: 200px; background: linear-gradient(to bottom, rgba(241, 196, 15, 0.8), transparent); z-index: 5; opacity: 0; transform: translateX(-50%); border-radius: 15px; filter: blur(2px); }

        /* 막 시스템 뷰 (전자전달계 / 명반응) */
        .membrane-view { display: none; width: 100%; height: 100%; position: relative; background: #131b26; border-radius: 15px; overflow: hidden; }
        .mem-photo { background: #061c14 !important; }
        .membrane { position: absolute; top: 50%; transform: translateY(-50%); width: 100%; height: 180px; background: rgba(243, 156, 18, 0.1); border-top: 4px solid #d35400; border-bottom: 4px solid #d35400; display: flex; justify-content: space-around; align-items: center; padding: 0 10px; }
        .membrane.photo-mem { background: rgba(39, 174, 96, 0.1); border-color: #27ae60; }
        
        .complex { background: #8e44ad; color: white; font-weight: bold; border-radius: 15px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 2px solid #732d91; box-shadow: inset 0 0 20px rgba(0,0,0,0.5); z-index: 10; text-align: center; }
        .c-photo { background: #009432; border-color: #006266; }
        
        /* ETC 구조 */
        .c-I { width: 85px; height: 210px; }
        .c-II { width: 70px; height: 100px; align-self: flex-end; margin-bottom: -35px; }
        .c-Q { width: 50px; height: 50px; border-radius: 50%; background: #e67e22; align-self: flex-start; margin-top: -25px; border: 2px solid #d35400; }
        .c-III { width: 85px; height: 210px; }
        .c-CytC { width: 50px; height: 50px; border-radius: 50%; background: #e67e22; align-self: flex-start; margin-top: -25px; border: 2px solid #d35400; }
        .c-IV { width: 85px; height: 210px; }
        
        /* Light Rxn 구조 */
        .c-PS2 { width: 90px; height: 220px; }
        .c-PQ { width: 50px; height: 50px; border-radius: 50%; background: #f39c12; align-self: flex-start; margin-top: -25px; border: 2px solid #d35400; }
        .c-b6f { width: 90px; height: 220px; }
        .c-PC { width: 50px; height: 50px; border-radius: 50%; background: #2980b9; align-self: flex-start; margin-top: -25px; border: 2px solid #1f618d; }
        .c-PS1 { width: 90px; height: 220px; }
        .c-Fd { width: 50px; height: 50px; border-radius: 50%; background: #8e44ad; align-self: flex-start; margin-top: -25px; border: 2px solid #732d91; }

        .c-ATP { width: 120px; height: 240px; background: #c0392b; border-color: #922b21; border-radius: 20px 20px 5px 5px; position: relative; }
        .rotor { position: absolute; bottom: -20px; width: 70px; height: 40px; background: #e74c3c; border-radius: 10px; box-shadow: 0 5px 10px rgba(0,0,0,0.5); }
        .rotor.spin { animation: spin 0.8s infinite linear; }
        .rotor.spin-rev { animation: spinRev 0.8s infinite linear; top: -20px; bottom: auto; border-radius: 5px 5px 20px 20px; }
        @keyframes spin { 100% { transform: rotateY(360deg); } }
        @keyframes spinRev { 100% { transform: rotateY(-360deg); } }

        .space-label { position: absolute; width: 100%; text-align: center; font-weight: bold; font-size: 1.5rem; color: #a4b0be; }

        /* 오른쪽 정보 패널 */
        .info-panel { flex: 1; min-width: 320px; background: var(--panel); border-radius: 15px; padding: 2rem; display: flex; flex-direction: column; box-shadow: 0 5px 15px rgba(0,0,0,0.3); margin-bottom: 1rem; }
        .pnl-resp { border-top: 5px solid var(--primary); }
        .pnl-photo { border-top: 5px solid var(--photo); }
        .info-panel h3 { margin-top: 0; font-size: 1.6rem; border-bottom: 2px solid #555; padding-bottom: 1rem; color: #fff; }
        .info-row { margin-bottom: 1rem; font-size: 1.1rem; display: flex; align-items: flex-start; gap: 0.5rem; line-height: 1.4; }
        .badge { padding: 0.3rem 0.6rem; border-radius: 5px; font-size: 0.9rem; font-weight: bold; width: 85px; text-align: center; flex-shrink: 0; background: #111; border: 1px solid #555; }
        .desc-box { background: #222f3e; padding: 1.5rem; border-radius: 10px; font-size: 1.1rem; line-height: 1.6; color: #c8d6e5; margin-top: auto; }
        .desc-resp { border-left: 4px solid var(--primary); }
        .desc-photo { border-left: 4px solid var(--photo); }
    </style>
</head>
<body>

    <header>
        <h1><span class="h-resp">세포호흡</span> & <span class="h-photo">광합성</span> 완벽 시뮬레이터</h1>
        <button class="home-btn" onclick="goHome()">메뉴로 가기</button>
    </header>

    <div id="app">
        <!-- 1. 메인 메뉴 -->
        <div id="screen-main" class="screen active menu-wrapper">
            <h1 class="main-title">학습할 대사과정을 선택하세요</h1>
            <div class="menu-grid">
                <div class="menu-card card-resp" onclick="showSubMenu('resp')">
                    <h2 style="color: var(--primary); font-size:2rem; margin-top:0;">세포호흡</h2>
                    <p style="color:#aaa; font-size:1.1rem;">포도당 분해 (이화작용)<br>해당과정 · TCA · 전자전달계</p>
                </div>
                <div class="menu-card card-photo" onclick="showSubMenu('photo')">
                    <h2 style="color: var(--photo); font-size:2rem; margin-top:0;">광합성</h2>
                    <p style="color:#aaa; font-size:1.1rem;">포도당 합성 (동화작용)<br>명반응 · 캘빈 회로</p>
                </div>
            </div>
        </div>

        <!-- 2. 서브 메뉴 (세포호흡) -->
        <div id="screen-sub-resp" class="screen menu-wrapper">
            <h1 class="main-title" style="color: var(--primary);">세포호흡 (Cellular Respiration)</h1>
            <div style="width: 100%; max-width: 400px;">
                <button class="sub-btn btn-resp" onclick="startSim('resp', 'glyco')">1. 해당과정 (1~10단계)</button>
                <button class="sub-btn btn-resp" onclick="startSim('resp', 'tca')">2. Link & TCA 회로 (11~19단계)</button>
                <button class="sub-btn btn-resp" onclick="startSim('resp', 'etc')">3. 산화적 인산화 (20단계)</button>
                <button class="sub-btn btn-resp" style="background:var(--primary); color:white; margin-top:2rem;" onclick="startSim('resp', 'all')">전체 20단계 연속 재생</button>
            </div>
        </div>

        <!-- 3. 서브 메뉴 (광합성) -->
        <div id="screen-sub-photo" class="screen menu-wrapper">
            <h1 class="main-title" style="color: var(--photo);">광합성 (Photosynthesis)</h1>
            <div style="width: 100%; max-width: 400px;">
                <button class="sub-btn btn-photo" onclick="startSim('photo', 'light')">1. 명반응 (틸라코이드 막)</button>
                <button class="sub-btn btn-photo" onclick="startSim('photo', 'calvin')">2. 캘빈 회로 (스트로마)</button>
                <button class="sub-btn btn-photo" style="background:var(--photo); color:white; margin-top:2rem;" onclick="startSim('photo', 'all')">광합성 전체 연속 재생</button>
            </div>
        </div>

        <!-- 4. 시뮬레이터 화면 -->
        <div id="screen-sim" class="screen">
            <div class="sim-header">
                <h2 id="sim-title" style="margin:0;">단계명</h2>
                <div class="progress-bar"><div class="progress-fill" id="sim-progress"></div></div>
                <span id="sim-counter" style="font-weight:bold; font-size:1.2rem;">1 / 20</span>
            </div>

            <div class="sim-body">
                <!-- 왼쪽: 시각화 영역 -->
                <div class="visual-area">
                    <div class="views-container">
                        <div id="anim-layer"></div>
                        
                        <!-- 화학 반응 구조식 뷰 -->
                        <div id="reaction-view" class="reaction-view">
                            <div class="mol-box" id="box-react">
                                <div class="mol-name" id="name-react">반응물</div>
                                <div class="mol-structure" id="struct-react"></div>
                            </div>

                            <div class="arrow-wrap">
                                <div class="enz-tag" id="enz-name">효소</div>
                                <div class="arrow-line">&#10230;</div>
                            </div>

                            <div class="mol-box" id="box-prod" style="opacity: 0.3;">
                                <div class="mol-name prod" id="name-prod">생성물</div>
                                <div class="mol-structure" id="struct-prod"></div>
                            </div>
                        </div>

                        <!-- 막 시스템 뷰 -->
                        <div id="membrane-view" class="membrane-view">
                            <div class="space-label" id="mem-top-label" style="top: 20px;">막간 공간 (H⁺ 고농도)</div>
                            <div class="membrane" id="membrane-bg"></div>
                            <div class="space-label" id="mem-bot-label" style="bottom: 20px;">미토콘드리아 기질 (H⁺ 저농도)</div>
                        </div>
                    </div>

                    <!-- 하단 네비게이션 고정바 (터치 버그 원천 해결) -->
                    <div class="nav-controls" id="nav-controls">
                        <button class="nav-btn" id="btn-prev" onclick="moveStep(-1)">&#8592; 이전</button>
                        <button class="nav-btn replay-btn" onclick="playCurrentAnimation()">다시 재생</button>
                        <button class="nav-btn" id="btn-next" onclick="moveStep(1)">다음 &#8594;</button>
                    </div>
                </div>

                <!-- 오른쪽: 정보 패널 -->
                <div class="info-panel" id="info-panel">
                    <h3 id="info-step-name">단계명</h3>
                    <div class="info-row"><span class="badge b-react" style="color:#00d2d3;">반응물</span><span id="info-react"></span></div>
                    <div class="info-row"><span class="badge b-prod" style="color:#10ac84;">생성물</span><span id="info-prod"></span></div>
                    <div class="info-row"><span class="badge b-enz" style="color:#feca57;">관여 효소</span><span id="info-enz"></span></div>
                    <div class="desc-box" id="info-desc">상세 설명</div>
                </div>
            </div>
        </div>
    </div>

<script>
    /* ----- 1. 수소(H) 생략 전혀 없는 완벽한 Grid-Flex 구조식 엔진 ----- */
    const A = (el, id='') => {
        let cls = 'atom ' + (['COO','CoA'].includes(el) ? 'group' : el.charAt(0));
        return `<div class="mol-c"><div class="${cls}" ${id ? `id="${id}"`:''}>${el}</div></div>`;
    };
    const C = (el, bonds, id='') => {

        { step:6, phase:'암반응 (스트로마)', name:'6. 인산화', react:'3PG', prod:'1,3-BPG', strR:M.pg3, strP:M.bpg13, enz:'Phosphoglycerate\nkinase', anim:'atp_to_adp', desc:[span_12](start_span)'[span_12](end_span) 명반응에서 만든 ATP를 소모하여 3PG에 인산기를 하나 더 붙여 1,3-BPG를 만든다.' },
        { step:7, phase:'암반응 (스트로마)', name:'7. 환원', react:'1,3-BPG', prod:'G3P', strR:M.bpg13, strP:M.g3p, enz:'G3P dehydrogenase', anim:'nadph_to_nadp', desc:[span_13](start_span)'[span_13](end_span) 명반응에서 만든 NADPH의 고에너지 전자를 1,3-BPG에 쏟아부어 G3P(포도당 재료)로 환원시킨다. 인산기 1개는 떨어져 나간다.' },

    let currentMode = 'resp';
    let currentProcess = [];
    let currentIndex = 0;

    /* ----- 3. 물리적 블록 애니메이션 엔진 ----- */
    function createAnimGroup(type, x, y) {
        const layer = document.getElementById('anim-layer');
        const div = document.createElement('div');
        div.className = `anim-group`;
        div.style.left = `${x}px`; div.style.top = `${y}px`;
        
        if(type === 'ATP') {
            div.innerHTML = `<div class="a-base a-ad">Ad</div><div style="display:flex;gap:2px;"><div class="p-ball">P</div><div class="p-ball">P</div><div class="p-ball" style="background:#e84118;color:white;">P</div></div>`;
        } else if(type === 'ADP' || type === 'GDP') {
            div.innerHTML = `<div class="a-base a-ad">${type === 'ADP' ? 'Ad':'Gu'}</div><div style="display:flex;gap:2px;"><div class="p-ball">P</div><div class="p-ball">P</div></div>`;
        } else if(type === 'NAD' || type === 'NADP') {
            div.innerHTML = `<div class="a-base a-nad">${type}⁺</div>`;
        } else if(type === 'NADH' || type === 'NADPH') {
            div.innerHTML = `<div class="a-base a-nad" style="background:#20bf6b;">${type}</div>`;
        } else if(type === 'FAD') {
            div.innerHTML = `<div class="a-base a-fad">FAD</div>`;
        } else if(type === 'FADH2') {
            div.innerHTML = `<div class="a-base a-fad" style="background:#20bf6b;">FADH₂</div>`;
        } else if(type === 'CoA') {
            div.innerHTML = `<div class="a-base a-coa">CoA</div>`;
        } else if(type === 'CO2') {
            div.innerHTML = `<div class="a-base a-co2">CO₂</div>`;
        } else if(type === 'H2O') {
            div.innerHTML = `<div class="a-base a-h2o">H₂O</div>`;
        } else if (type === 'O2') {
            div.innerHTML = `<div class="a-o2">O₂</div>`;
        }
        
        layer.appendChild(div);
        return div;
    }

    function createParticle(type, x, y) {
        const layer = document.getElementById('anim-layer');
        const div = document.createElement('div');
        div.className = `fly-${type}`;
        div.innerText = type === 'e' ? 'e⁻' : type === 'h' ? 'H⁺' : 'P';
        div.style.left = `${x}px`; div.style.top = `${y}px`;
        layer.appendChild(div);
        return div;
    }

    function playCurrentAnimation() {
        const data = currentProcess[currentIndex];
        
        if(data.anim === 'etc_view') { playETCAnimation(); return; }
        if(data.anim.includes('light_view')) { playLightAnimation(data.step); return; }

        const layer = document.getElementById('anim-layer');
        layer.innerHTML = '';
        
        const vArea = document.querySelector('.reaction-view').getBoundingClientRect();
        const startX = vArea.width * 0.25; 
        const midX = vArea.width * 0.5; 
        const prodX = vArea.width * 0.75;
        const topY = 40; 
        const midY = vArea.height * 0.5; 
        const botY = vArea.height - 40;

        const boxProd = document.getElementById('box-prod');
        boxProd.style.opacity = '0.3'; boxProd.style.transform = 'scale(0.9)';

        const finishAnim = () => { boxProd.style.opacity = '1'; boxProd.style.transform = 'scale(1)'; };

        // ATP -> ADP (인산화)
        if(data.anim === 'atp_to_adp') {
            let atp = createAnimGroup('ATP', midX, topY);
            atp.animate([{transform: 'translate(-50%, -80px)', opacity:0}, {transform: 'translate(-50%, 0)', opacity:1}], {duration:500, fill:'forwards'});
            
            setTimeout(() => {
                let targetP = document.getElementById('target-p');
                let targetX = prodX - 30; let targetY = midY;
                if(targetP) {
                    let r = targetP.getBoundingClientRect();
                    let containerRect = document.querySelector('.reaction-view').getBoundingClientRect();
                    targetX = r.left - containerRect.left + (r.width/2);
                    targetY = r.top - containerRect.top + (r.height/2);
                }

                let p = createParticle('p', midX + 40, topY);
                atp.innerHTML = `<div class="a-base a-ad">Ad</div><div style="display:flex;gap:2px;"><div class="p-ball">P</div><div class="p-ball">P</div></div>`; // ADP 변신
                
                p.animate([{left:`${midX+40}px`, top:`${topY}px`}, {left:`${targetX}px`, top:`${targetY}px`}], {duration: 600, easing: 'ease-in-out', fill:'forwards'});
                atp.animate([{transform: 'translate(-50%, 0)', opacity:1}, {transform: 'translate(-50%, -80px)', opacity:0}], {duration:600, delay: 600, fill:'forwards'});
                
                setTimeout(() => { p.remove(); finishAnim(); }, 600);
            }, 800);
        }
        // ADP -> ATP (기질수준 인산화)
        else if(data.anim === 'adp_to_atp' || data.anim === 'gdp_to_gtp') {
            let adp = createAnimGroup(data.anim==='adp_to_atp' ? 'ADP':'GDP', midX, topY);
            adp.animate([{transform: 'translate(-50%, -80px)', opacity:0}, {transform: 'translate(-50%, 0)', opacity:1}], {duration:500, fill:'forwards'});
            
            setTimeout(() => {
                let p = createParticle('p', startX+30, midY);
                p.animate([{left:`${startX+30}px`, top:`${midY}px`}, {left:`${midX+40}px`, top:`${topY}px`}], {duration: 600, easing: 'ease-in-out', fill:'forwards'});
                
                setTimeout(() => {
                    p.remove();
                    adp.innerHTML = `<div class="a-base a-ad">${data.anim==='adp_to_atp' ? 'Ad':'Gu'}</div><div style="display:flex;gap:2px;"><div class="p-ball">P</div><div class="p-ball">P</div><div class="p-ball" style="background:#e84118;color:white;">P</div></div>`;
                    adp.animate([{transform: 'translate(-50%, 0)', opacity:1}, {transform: 'translate(-50%, -80px)', opacity:0}], {duration:600, delay: 400, fill:'forwards'});
                    finishAnim();
                }, 600);
            }, 800);
        }
        // 조효소 산화/환원 (NAD+, FAD)
        else if(data.anim.includes('nad_to_nadh') || data.anim.includes('fad_to_fadh2') || data.anim.includes('link_reaction')) {
            let isFAD = data.anim.includes('fad');
            let coenz = createAnimGroup(isFAD ? 'FAD' : 'NAD', midX, topY);
            coenz.animate([{transform: 'translate(-50%, -80px)', opacity:0}, {transform: 'translate(-50%, 0)', opacity:1}], {duration:500, fill:'forwards'});
            
            setTimeout(() => {
                let e1 = createParticle('e', startX+20, midY-15); let e2 = createParticle('e', startX+40, midY-15);
                let h1 = createParticle('h', startX+20, midY+15); let h2 = createParticle('h', startX+40, midY+15); 
                
                e1.animate([{left:`${startX+20}px`, top:`${midY-15}px`}, {left:`${midX-10}px`, top:`${topY}px`}], {duration:500, fill:'forwards'});
                e2.animate([{left:`${startX+40}px`, top:`${midY-15}px`}, {left:`${midX+10}px`, top:`${topY}px`}], {duration:500, fill:'forwards'});
                h1.animate([{left:`${startX+20}px`, top:`${midY+15}px`}, {left:`${midX+30}px`, top:`${topY}px`}], {duration:500, fill:'forwards'});
                
                // h2 방출 (2H+ 중 1개)
                h2.animate([{left:`${startX+40}px`, top:`${midY+15}px`, opacity:1}, {left:`${midX+150}px`, top:`${botY-50}px`, opacity:0}], {duration:800, fill:'forwards'});

                if(data.anim === 'nad_to_nadh_p') {
                    let p = createParticle('p', midX, botY);
                    p.animate([{left:`${midX}px`, top:`${botY}px`, opacity:1}, {left:`${prodX-30}px`, top:`${midY}px`, opacity:1}], {duration:600, fill:'forwards'});
                    setTimeout(()=>p.remove(), 600);
                }

                if(data.anim.includes('co2') || data.anim.includes('link_reaction')) {
                    let co2 = createAnimGroup('CO2', startX+30, midY);
                    co2.animate([{opacity:1, transform:'translate(-50%, 0) scale(1)'}, {opacity:0, transform:'translate(30px, 80px) scale(0.5)'}], {duration:1000, fill:'forwards'});
                }

                if(data.anim.includes('link_reaction')) {
                    let coa = createAnimGroup('CoA', midX, botY);
                    coa.animate([{opacity:0, transform:'translate(-50%, 50px)'}, {opacity:1, transform:'translate(-50%, 0)'}, {opacity:0, transform:'translate(-120px, -80px)'}], {duration:1200, fill:'forwards'});
                }

                setTimeout(() => {
                    e1.remove(); e2.remove(); h1.remove();
                    coenz.innerHTML = `<div class="a-base ${isFAD ? 'a-fad':'a-nad'}" style="background:#20bf6b;">${isFAD ? 'FADH₂':'NADH + H⁺'}</div>`;
                    coenz.animate([{transform: 'translate(-50%, 0)', opacity:1}, {transform: 'translate(-50%, -80px)', opacity:0}], {duration:800, delay:400, fill:'forwards'});
                    finishAnim();
                }, 500);
            }, 800);
        }
        // 환원 반응 (NADPH -> NADP+) - 캘빈 회로
        else if(data.anim === 'nadph_to_nadp') {
            let nadph = createAnimGroup('NADPH', midX, topY);
            nadph.animate([{transform: 'translate(-50%, -80px)', opacity:0}, {transform: 'translate(-50%, 0)', opacity:1}], {duration:500, fill:'forwards'});
            
            setTimeout(() => {
                let e1 = createParticle('e', midX-10, topY); let e2 = createParticle('e', midX+10, topY);
                let h1 = createParticle('h', midX+30, topY); 
                
                nadph.innerHTML = `<div class="a-base a-nad">NADP⁺</div>`;

                e1.animate([{left:`${midX-10}px`, top:`${topY}px`}, {left:`${prodX-20}px`, top:`${midY-15}px`}], {duration:500, fill:'forwards'});
                e2.animate([{left:`${midX+10}px`, top:`${topY}px`}, {left:`${prodX-40}px`, top:`${midY-15}px`}], {duration:500, fill:'forwards'});
                h1.animate([{left:`${midX+30}px`, top:`${topY}px`}, {left:`${prodX-20}px`, top:`${midY+15}px`}], {duration:500, fill:'forwards'});

                let p = createParticle('p', startX+30, midY); // 인산기 탈락
                p.animate([{left:`${startX+30}px`, top:`${midY}px`, opacity:1}, {left:`${midX}px`, top:`${botY}px`, opacity:0}], {duration:800, fill:'forwards'});

                setTimeout(() => {
                    e1.remove(); e2.remove(); h1.remove(); p.remove();
                    nadph.animate([{transform: 'translate(-50%, 0)', opacity:1}, {transform: 'translate(-50%, -80px)', opacity:0}], {duration:800, delay:400, fill:'forwards'});
                    finishAnim();
                }, 500);
            }, 800);
        }
        else if(data.anim === 'dehydration' || data.anim === 'co2_fix') {
            let p_group = createAnimGroup(data.anim==='co2_fix'?'CO2':'H2O', startX+30, midY);
            if(data.anim === 'co2_fix') {
                p_group.animate([{opacity:0, transform:'translate(-50%, -50px) scale(0.5)'}, {opacity:1, transform:'translate(-50%, 0) scale(1)'}], {duration:1000, fill:'forwards'});
            } else {
                p_group.animate([{opacity:1, transform:'translate(-50%, 0) scale(1)'}, {opacity:0, transform:'translate(0, 80px) scale(0.5)'}], {duration:1000, fill:'forwards'});
            }
            setTimeout(finishAnim, 800);
        }
        else if(data.anim === 'hydration' || data.anim === 'merge') {
            let obj = createAnimGroup(data.anim==='merge'?'CoA':'H2O', midX, botY);
            obj.animate([{opacity:0, transform:'translate(-50%, 50px)'}, {opacity:1, transform:'translate(-50%, 0)'}, {opacity:0, transform:'translate(-120px, -100px)'}], {duration:1200, fill:'forwards'});
            setTimeout(finishAnim, 800);
        }
        else {
            setTimeout(finishAnim, 600); // morph
        }
    }

    // 20단계 전자전달계 풀 애니메이션 (산화, 물 생성 포함)
    function playETCAnimation() {
        const layer = document.getElementById('anim-layer');
        layer.innerHTML = '';

        const etcArea = document.getElementById('etc-view').getBoundingClientRect();
        
        // 1. NADH 산화 (Complex I)
        setTimeout(() => {
            let nadh = createAnimGroup('NADH', 100, etcArea.height - 40);
            nadh.animate([{opacity:0, transform:'translate(-50%, 20px)'}, {opacity:1, transform:'translate(-50%, 0)'}], {duration:500, fill:'forwards'});
            
            setTimeout(() => {
                let e1 = createParticle('e', 100, etcArea.height - 40); let e2 = createParticle('e', 110, etcArea.height - 40);
                let h1 = createParticle('h', 90, etcArea.height - 40); let h2 = createParticle('h', 120, etcArea.height - 40);

                e1.animate([{left:'100px', top:`${etcArea.height - 40}px`}, {left:'100px', top:`${etcArea.height/2}px`}], {duration:800, fill:'forwards'});
                e2.animate([{left:'110px', top:`${etcArea.height - 40}px`}, {left:'110px', top:`${etcArea.height/2}px`}], {duration:800, fill:'forwards'});
                h1.animate([{left:'90px', top:`${etcArea.height - 40}px`}, {left:'90px', top:`${etcArea.height/2}px`}], {duration:800, fill:'forwards'});
                h2.animate([{left:'120px', top:`${etcArea.height - 40}px`}, {left:'120px', top:`${etcArea.height/2}px`}], {duration:800, fill:'forwards'});

                nadh.innerHTML = `<div class="a-base a-nad">NAD⁺</div>`;
                nadh.animate([{opacity:1}, {opacity:0, transform:'translate(-50%, 20px)'}], {duration:500, delay: 500, fill:'forwards'});

                setTimeout(() => { e1.remove(); e2.remove(); h1.remove(); h2.remove(); nadh.remove(); }, 1000);
            }, 600);
        }, 500);

        // 2. FADH2 산화 (Complex II)
        setTimeout(() => {
            let fadh2 = createAnimGroup('FADH2', 250, etcArea.height - 30);
            fadh2.animate([{opacity:0, transform:'translate(-50%, 20px)'}, {opacity:1, transform:'translate(-50%, 0)'}], {duration:500, fill:'forwards'});
            
            setTimeout(() => {
                let e1 = createParticle('e', 250, etcArea.height - 30); let e2 = createParticle('e', 260, etcArea.height - 30);
                let h1 = createParticle('h', 240, etcArea.height - 30); let h2 = createParticle('h', 270, etcArea.height - 30);

                e1.animate([{left:'250px', top:`${etcArea.height - 30}px`}, {left:'250px', top:`${etcArea.height/2 + 20}px`}], {duration:800, fill:'forwards'});
                e2.animate([{left:'260px', top:`${etcArea.height - 30}px`}, {left:'260px', top:`${etcArea.height/2 + 20}px`}], {duration:800, fill:'forwards'});
                h1.animate([{left:'240px', top:`${etcArea.height - 30}px`}, {left:'240px', top:`${etcArea.height/2 + 20}px`}], {duration:800, fill:'forwards'});
                h2.animate([{left:'270px', top:`${etcArea.height - 30}px`}, {left:'270px', top:`${etcArea.height/2 + 20}px`}], {duration:800, fill:'forwards'});

                fadh2.innerHTML = `<div class="a-base a-fad">FAD</div>`;
                fadh2.animate([{opacity:1}, {opacity:0, transform:'translate(-50%, 20px)'}], {duration:500, delay: 500, fill:'forwards'});

                setTimeout(() => { e1.remove(); e2.remove(); h1.remove(); h2.remove(); fadh2.remove(); }, 1000);
            }, 600);
        }, 2500);

        // 3. 최종 전자 수용체 산소 결합 (Complex IV -> H2O)
        setTimeout(() => {
            let o2 = createAnimGroup('O2', etcArea.width * 0.8, etcArea.height - 40);
            o2.animate([{opacity:0, transform:'translate(-50%, -50%) scale(0.5)'}, {opacity:1, transform:'translate(-50%, -50%) scale(1)'}], {duration:500, fill:'forwards'});

            setTimeout(() => {
                let e1 = createParticle('e', etcArea.width * 0.77, etcArea.height/2); let e2 = createParticle('e', etcArea.width * 0.79, etcArea.height/2);
                let h1 = createParticle('h', etcArea.width * 0.85, etcArea.height/2); let h2 = createParticle('h', etcArea.width * 0.87, etcArea.height/2);

                e1.animate([{top:`${etcArea.height/2}px`, opacity:1}, {top:`${etcArea.height - 40}px`, opacity:0}], {duration:800, fill:'forwards'});
                e2.animate([{top:`${etcArea.height/2}px`, opacity:1}, {top:`${etcArea.height - 40}px`, opacity:0}], {duration:800, fill:'forwards'});
                h1.animate([{top:`${etcArea.height/2}px`, opacity:1}, {left:`${etcArea.width * 0.8}px`, top:`${etcArea.height - 40}px`, opacity:0}], {duration:800, fill:'forwards'});
                h2.animate([{top:`${etcArea.height/2}px`, opacity:1}, {left:`${etcArea.width * 0.8}px`, top:`${etcArea.height - 40}px`, opacity:0}], {duration:800, fill:'forwards'});

                setTimeout(() => {
                    o2.innerHTML = `<div class="a-base a-h2o">H₂O</div>`;
                    o2.animate([{transform:'translate(-50%, -50%) scale(1)'}, {transform:'translate(-50%, calc(-50% + 30px)) scale(0.5)', opacity:0}], {duration:1000, delay: 500, fill:'forwards'});
                }, 800);
            }, 600);
        }, 5000);
    }

    // 광합성 명반응 특별 애니메이션
    function playLightAnimation(stepNum) {
        const layer = document.getElementById('anim-layer');
        layer.innerHTML = '';
        const etcArea = document.getElementById('membrane-view').getBoundingClientRect();

        if(stepNum === 1) {
            let beam = document.createElement('div');
            beam.className = 'fly-light'; beam.style.left = '140px'; beam.style.top = '0';
            layer.appendChild(beam);
            beam.animate([{top:'0', opacity:1}, {top:`${etcArea.height/2}px`, opacity:0}], {duration:1000, fill:'forwards'});

            setTimeout(() => {
                let h2o = createAnimGroup('H2O', 140, etcArea.height - 40);
                h2o.animate([{opacity:1}, {opacity:0, transform:'translate(-50%, -30px)'}], {duration:800, fill:'forwards'});
                
                setTimeout(() => {
                    let e1 = createParticle('e', 140, etcArea.height/2); e1.animate([{opacity:0},{opacity:1}], {duration:300, fill:'forwards'});
                    let h1 = createParticle('h', 120, etcArea.height - 40); h1.animate([{opacity:1}, {top:`${etcArea.height}px`, opacity:0}], {duration:800, fill:'forwards'});
                    let o2 = createAnimGroup('O2', 160, etcArea.height - 40); o2.animate([{opacity:1, transform:'translate(-50%, -50%)'}, {top:`${etcArea.height}px`, opacity:0, transform:'translate(-50%, -50%)'}], {duration:800, fill:'forwards'});
                }, 500);
            }, 500);
        }
        else if (stepNum === 3) {
            let beam = document.createElement('div');
            beam.className = 'fly-light'; beam.style.left = '510px'; beam.style.top = '0';
            layer.appendChild(beam);
            beam.animate([{top:'0', opacity:1}, {top:`${etcArea.height/2}px`, opacity:0}], {duration:1000, fill:'forwards'});
            
            setTimeout(() => {
                let nadp = createAnimGroup('NADP', 600, 40);
                nadp.animate([{opacity:0, transform:'translate(-50%, -20px)'}, {opacity:1, transform:'translate(-50%, 0)'}], {duration:500, fill:'forwards'});
                
                let e1 = createParticle('e', 550, etcArea.height/2);
                let h1 = createParticle('h', 630, 40);
                
                e1.animate([{left:'550px', top:`${etcArea.height/2}px`}, {left:'600px', top:'40px'}], {duration:800, fill:'forwards'});
                h1.animate([{left:'630px', top:'40px'}, {left:'600px', top:'40px'}], {duration:800, fill:'forwards'});
                
                setTimeout(() => {
                    e1.remove(); h1.remove();
                    nadp.innerHTML = `<div class="a-base a-nad" style="background:#20bf6b;">NADPH</div>`;
                    nadp.animate([{opacity:1, transform:'translate(-50%, 0)'}, {opacity:0, transform:'translate(-50%, -40px)'}], {duration:800, delay:400, fill:'forwards'});
                }, 800);
            }, 800);
        }
    }

    /* ----- 4. 페이지 컨트롤러 ----- */
    function goHome() {
        document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
        document.getElementById('nav-controls').style.display = 'none';
        document.getElementById('screen-main').classList.add('active');
    }

    function showSubMenu(type) {
        currentMode = type;
        document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
        document.getElementById(`screen-sub-${type}`).classList.add('active');
        
        let headerColor = type === 'resp' ? 'var(--primary)' : 'var(--photo)';
        document.getElementById('sim-counter').style.color = headerColor;
        document.getElementById('sim-title').style.color = headerColor;
        document.querySelector('.progress-fill').className = `progress-fill fill-${type}`;
    }

    function startSim(type, scope) {
        currentMode = type;
        if(type === 'resp') {
            if (scope === 'glyco') currentProcess = DB_RESP.slice(0, 10);
            else if (scope === 'tca') currentProcess = DB_RESP.slice(10, 19);
            else if (scope === 'etc') currentProcess = DB_RESP.slice(19, 20);
            else currentProcess = DB_RESP;
        } else {
            if (scope === 'light') currentProcess = DB_PHOTO.slice(0, 4);
            else if (scope === 'calvin') currentProcess = DB_PHOTO.slice(4, 8);
            else currentProcess = DB_PHOTO;
        }
        
        currentIndex = 0;
        document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
        document.getElementById('screen-sim').classList.add('active');
        document.getElementById('nav-controls').style.display = 'flex'; // 고정 버튼 보이기
        
        // CSS 패널 색상 변경
        document.getElementById('info-panel').className = `info-panel pnl-${type}`;
        document.getElementById('info-desc').className = `desc-box desc-${type}`;
        
        updateUI();
    }

    function moveStep(dir) {
        currentIndex += dir;
        if (currentIndex < 0) currentIndex = 0;
        if (currentIndex >= currentProcess.length) currentIndex = currentProcess.length - 1;
        updateUI();
    }

    function renderMembrane(type, stepNum) {
        const memBg = document.getElementById('membrane-bg');
        if(type === 'resp') {
            document.getElementById('membrane-view').className = 'membrane-view';
            memBg.className = 'membrane';
            document.getElementById('mem-top-label').innerText = '막간 공간 (H⁺ 고농도)';
            document.getElementById('mem-bot-label').innerText = '미토콘드리아 기질 (H⁺ 저농도)';
            
            memBg.innerHTML = `
                <div class="complex c-I">I<br><span style="font-size:11px; font-weight:normal;">FMN<br>FeS</span></div>
                <div class="complex c-Q">Q</div>
                <div class="complex c-II">II<br><span style="font-size:11px; font-weight:normal;">FAD</span></div>
                <div class="complex c-III">III<br><span style="font-size:11px; font-weight:normal;">Cyt b</span></div>
                <div class="complex c-CytC">C</div>
                <div class="complex c-IV">IV<br><span style="font-size:11px; font-weight:normal;">Cyt a</span></div>
                <div class="complex c-ATP">ATP<br>Synthase<div class="rotor spin"></div></div>
                <div class="etc-e">2e⁻</div>
                <div class="etc-h pump1">4H⁺</div>
                <div class="etc-h pump3">4H⁺</div>
                <div class="etc-h pump4">2H⁺</div>
                <div class="atp-fall">H⁺ 쏟아짐</div>
                <div style="position:absolute; right:3%; bottom:10%; font-weight:bold; font-size:1.4rem; color:#f1c40f;">ADP + Pi → <span style="color:#e84118; font-size:1.8rem;">ATP</span></div>
            `;
        } else {
            // 광합성 틸라코이드 막
            document.getElementById('membrane-view').className = 'membrane-view mem-photo';
            memBg.className = 'membrane photo-mem';
            document.getElementById('mem-top-label').innerText = '스트로마 (H⁺ 저농도)';
            document.getElementById('mem-bot-label').innerText = '틸라코이드 내강 (H⁺ 고농도)';
            
            memBg.innerHTML = `
                <div class="complex c-photo c-PS2">PSII<br><span style="font-size:11px; font-weight:normal;">P680</span></div>
                <div class="complex c-photo c-PQ">PQ</div>
                <div class="complex c-photo c-b6f">Cyt<br>b6f</div>
                <div class="complex c-photo c-PC">PC</div>
                <div class="complex c-photo c-PS1">PSI<br><span style="font-size:11px; font-weight:normal;">P700</span></div>
                <div class="complex c-photo c-Fd">Fd</div>
                <div class="complex c-ATP">ATP<br>Synthase<div class="rotor spin-rev"></div></div>
                ${(stepNum === 2 || stepNum === 3) ? '<div class="etc-e" style="animation-duration:4s;">2e⁻</div>' : ''}
                ${stepNum === 2 ? '<div class="etc-h pump3" style="left:38%; animation:pumpH 4s infinite 1s; top:20%;">H⁺ 펌핑</div>' : ''}
                ${stepNum === 4 ? '<div class="atp-fall" style="top:auto; bottom:20%; animation:fallH 2s infinite reverse;">H⁺ 방출</div><div style="position:absolute; right:3%; top:10%; font-weight:bold; font-size:1.4rem; color:#f1c40f;">ADP + Pi → <span style="color:#e84118; font-size:1.8rem;">ATP</span></div>' : ''}
            `;
        }
    }

    function updateUI() {
        const data = currentProcess[currentIndex];
        
        document.getElementById('sim-title').innerText = data.phase;
        document.getElementById('sim-counter').innerText = `${currentIndex + 1} / ${currentProcess.length}`;
        document.getElementById('sim-progress').style.width = `${((currentIndex + 1) / currentProcess.length) * 100}%`;
        
        document.getElementById('info-step-name').innerText = data.name;
        document.getElementById('info-react').innerText = data.react;
        document.getElementById('info-prod').innerText = data.prod;
        document.getElementById('info-enz').innerText = data.enz.replace(/\n/g, ' ');
        document.getElementById('info-desc').innerHTML = data.desc;

        if (data.anim === 'etc_view' || data.anim.includes('light_view')) {
            document.getElementById('reaction-view').style.display = 'none';
            document.querySelector('.replay-btn').style.display = 'block';
            document.getElementById('membrane-view').style.display = 'block';
            renderMembrane(currentMode, data.step);
            playCurrentAnimation();
        } else {
            document.getElementById('reaction-view').style.display = 'flex';
            document.querySelector('.replay-btn').style.display = 'block';
            document.getElementById('membrane-view').style.display = 'none';

            document.getElementById('name-react').innerText = data.react.split(',')[0];
            document.getElementById('name-prod').innerText = data.prod.split(',')[0];
            document.getElementById('struct-react').innerHTML = data.strR;
            document.getElementById('struct-prod').innerHTML = data.strP;
            document.getElementById('enz-name').innerText = data.enz;

            playCurrentAnimation();
        }

        document.getElementById('btn-prev').disabled = (currentIndex === 0);
        document.getElementById('btn-next').disabled = (currentIndex === currentProcess.length - 1);
    }
</script>
</body>
</html>
