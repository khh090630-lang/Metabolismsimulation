<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>세포호흡 완벽 루이스 구조 시뮬레이터</title>
    <style>
        :root {
            --bg: #1e272e;
            --panel: #2f3640;
            --primary: #0fb9b1;
            --secondary: #20bf6b;
            --accent: #eb3b5a;
            --atom-c: #4b6584;
            --atom-o: #eb3b5a;
            --atom-h: #d1d8e0;
            --atom-p: #f7b731;
            --atom-s: #f39c12;
            --co2-col: #7f8c8d;
        }
        * { box-sizing: border-box; font-family: 'Pretendard', sans-serif; }
        body { margin: 0; background: var(--bg); color: #f5f6fa; display: flex; flex-direction: column; height: 100vh; overflow-y: auto; overflow-x: hidden; }
        
        header { background: #111; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.5); z-index: 1000; flex-shrink: 0; }
        header h1 { margin: 0; font-size: 1.5rem; color: var(--primary); }
        .home-btn { background: rgba(255,255,255,0.1); color: white; border: 1px solid #555; padding: 0.5rem 1rem; border-radius: 5px; cursor: pointer; transition: 0.2s; font-weight: bold; }
        .home-btn:hover { background: white; color: black; }
        
        #app { flex: 1; display: flex; flex-direction: column; padding: 1.5rem 2rem; width: 100%; max-width: 1400px; margin: 0 auto; }
        .screen { display: none; width: 100%; flex-direction: column; animation: fadeIn 0.3s; }
        .screen.active { display: flex; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* 메인 메뉴 */
        .menu-grid { display: flex; gap: 2rem; justify-content: center; margin-top: 5vh; flex-wrap: wrap; }
        .menu-card { background: var(--panel); padding: 3rem 2rem; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); text-align: center; cursor: pointer; border: 2px solid transparent; width: 300px; transition: 0.2s; }
        .menu-card:hover { border-color: var(--primary); transform: translateY(-5px); background: #353b48; }

        /* 시뮬레이터 뼈대 */
        .sim-header { background: var(--panel); padding: 1rem 2rem; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; flex-shrink: 0; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .progress-bar { flex: 1; height: 10px; background: #111; margin: 0 2rem; border-radius: 5px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--primary); width: 0%; transition: 0.3s; }
        
        .sim-body { display: flex; gap: 1rem; flex: 1; min-height: 600px; }
        
        /* 시각화 컨테이너 */
        .visual-area { flex: 2; min-width: 800px; background: #0b0e14; border-radius: 15px; border: 2px solid #444; display: flex; flex-direction: column; box-shadow: inset 0 0 50px rgba(0,0,0,0.8); position: relative; overflow: hidden; margin-bottom: 1rem; }
        .views-container { flex: 1; position: relative; display: flex; align-items: center; justify-content: center; padding: 2rem; overflow: hidden; padding-bottom: 90px; }
        
        /* 하단 고정 네비게이션 컨트롤 */
        .nav-controls { position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); background: rgba(30, 39, 46, 0.95); padding: 10px 25px; display: flex; justify-content: center; gap: 20px; border: 2px solid #555; border-radius: 50px; box-shadow: 0 10px 30px rgba(0,0,0,0.7); z-index: 9999; backdrop-filter: blur(5px); }
        .nav-btn { background: var(--panel); color: white; border: 2px solid #666; border-radius: 30px; padding: 0.6rem 2.5rem; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .nav-btn:hover:not(:disabled) { background: var(--primary); border-color: var(--primary); }
        .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .replay-btn { background: #f1c40f; color: #111; border: none; }

        /* 완벽한 루이스 구조식 Grid-Flex 시스템 */
        .reaction-view { display: flex; width: 100%; align-items: center; justify-content: center; gap: 2rem; position: relative; z-index: 10; padding-bottom: 2rem; }
        .mol-box { background: #2f3542; padding: 1.5rem; border-radius: 15px; border: 1px solid #555; display: flex; flex-direction: column; align-items: center; min-width: 320px; z-index: 10; transition: opacity 0.5s, transform 0.5s; box-shadow: 0 10px 20px rgba(0,0,0,0.4); }
        .mol-name { font-weight: bold; background: #111; padding: 0.5rem 1.5rem; border-radius: 20px; margin-bottom: 1.5rem; color: var(--primary); border: 1px solid #444; text-align: center; font-size: 1.1rem; }
        .mol-name.prod { color: var(--secondary); border-color: var(--secondary); }
        
        .m-row { display: flex; justify-content: center; align-items: center; height: 32px; width: 100%; }
        .m-vrow { display: flex; justify-content: center; align-items: center; height: 18px; width: 100%; }
        .mol-l { width: 110px; display: flex; justify-content: flex-end; align-items: center; position: relative; }
        .mol-r { width: 110px; display: flex; justify-content: flex-start; align-items: center; position: relative; }
        .mol-c { width: 34px; position: relative; display: flex; justify-content: center; align-items: center; z-index: 2; }
        
        /* 개별 원자 동그라미 스타일 */
        .atom { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 12px; z-index: 5; box-shadow: inset -1px -2px 4px rgba(0,0,0,0.4); position: relative; }
        .atom.C { background: var(--atom-c); color: white; border: 1px solid #333; }
        .atom.O { background: var(--atom-o); color: white; border: 1px solid #333; }
        .atom.H { background: var(--atom-h); color: #222; border: 1px solid #999; }
        .atom.P { background: var(--atom-p); color: #111; box-shadow: 0 0 10px rgba(247,183,49,0.8); border: 1px solid #d35400; }
        .atom.S { background: var(--atom-s); color: white; border: 1px solid #333; }
        .atom.CoA { background: #8e44ad; color: white; width: 40px; border-radius: 8px; font-size: 10px; border: 1px solid #333; }
        .atom.COO { background: var(--co2-col); color: white; width: 45px; border-radius: 8px; font-size: 10px; border: 1px solid #333; }

        /* 결합 선 스타일 */
        .bond { position: absolute; background: #8395a7; z-index: 1; }
        .bond.h { width: 20px; height: 4px; }
        .bond.hd { width: 20px; height: 10px; border-top: 3px solid #8395a7; border-bottom: 3px solid #8395a7; background: transparent; }
        .bond.v { height: 18px; width: 4px; }
        .bond.vd { height: 18px; width: 10px; border-left: 3px solid #8395a7; border-right: 3px solid #8395a7; background: transparent; }

        /* 효소 태그 */
        .arrow-wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 160px; z-index: 5; position: relative; }
        .enz-tag { background: #111; color: #f1c40f; padding: 0.8rem; border-radius: 10px; font-size: 0.95rem; font-weight: bold; text-align: center; border: 1px solid #f1c40f; box-shadow: 0 4px 10px rgba(0,0,0,0.5); z-index: 10; width: 130%; white-space: pre-wrap; line-height: 1.4; }
        .arrow-line { font-size: 3.5rem; color: #555; margin: -10px 0; }

        /* 블록형 애니메이션 에셋 */
        #anim-layer { position: absolute; inset: 0; pointer-events: none; z-index: 50; overflow: hidden; }
        .anim-group { position: absolute; display: flex; align-items: center; gap: 3px; opacity: 0; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5)); transform: translate(-50%, -50%); z-index: 100;}
        .a-base { padding: 6px 12px; border-radius: 6px; font-weight: bold; color: white; font-size: 13px; border: 1px solid rgba(255,255,255,0.3); display: flex; align-items: center; justify-content: center; }
        .a-ad { background: #2980b9; }
        .a-nad { background: #8e44ad; }
        .a-fad { background: #16a085; }
        .a-coa { background: #34495e; }
        .a-co2 { background: var(--co2-col); }
        .a-h2o { background: #3498db; }
        .a-o2 { background: #e74c3c; border-radius: 50%; width: 40px; height: 40px; display: flex; justify-content: center; align-items: center; font-weight: bold; }
        .p-ball { width: 22px; height: 22px; border-radius: 50%; background: var(--atom-p); color: #111; display: flex; justify-content: center; align-items: center; font-size: 11px; font-weight: bold; border: 1px solid #d35400; }
        
        /* 물리적 파티클 */
        .fly-p { position: absolute; width: 22px; height: 22px; border-radius: 50%; background: var(--atom-p); z-index: 60; display: flex; justify-content: center; align-items: center; font-size: 11px; font-weight: bold; color: #111; transform: translate(-50%, -50%); box-shadow: 0 0 10px rgba(247,183,49,0.8); border: 1px solid #d35400; }
        .fly-e { position: absolute; width: 14px; height: 14px; border-radius: 50%; background: #f1c40f; color: black; z-index: 60; display: flex; justify-content: center; align-items: center; font-size: 8px; font-weight: bold; box-shadow: 0 0 10px yellow; transform: translate(-50%, -50%); }
        .fly-h { position: absolute; width: 16px; height: 16px; border-radius: 50%; background: #00a8ff; color: white; z-index: 60; display: flex; justify-content: center; align-items: center; font-size: 9px; font-weight: bold; transform: translate(-50%, -50%); border: 1px solid white; box-shadow: 0 0 8px #00a8ff; }

        /* 20단계 전자전달계 뷰 */
        #etc-view { display: none; width: 100%; height: 100%; position: relative; background: #131b26; border-radius: 15px; margin-bottom: 50px; }
        .membrane { position: absolute; top: 50%; transform: translateY(-50%); width: 100%; height: 180px; background: rgba(243, 156, 18, 0.1); border-top: 4px solid #d35400; border-bottom: 4px solid #d35400; display: flex; justify-content: space-around; align-items: center; padding: 0 20px; }
        .complex { background: #8e44ad; color: white; font-weight: bold; border-radius: 15px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 2px solid #732d91; box-shadow: inset 0 0 20px rgba(0,0,0,0.5); z-index: 5; text-align: center; }
        .c-I { width: 85px; height: 210px; }
        .c-II { width: 70px; height: 100px; align-self: flex-end; margin-bottom: -35px; }
        .c-Q { width: 50px; height: 50px; border-radius: 50%; background: #e67e22; align-self: flex-start; margin-top: -25px; border: 2px solid #d35400; }
        .c-III { width: 85px; height: 210px; }
        .c-CytC { width: 50px; height: 50px; border-radius: 50%; background: #e67e22; align-self: flex-start; margin-top: -25px; border: 2px solid #d35400; }
        .c-IV { width: 85px; height: 210px; }
        .c-ATP { width: 120px; height: 230px; background: #c0392b; border-color: #922b21; border-radius: 20px 20px 5px 5px; position: relative; }
        .rotor { position: absolute; bottom: -20px; width: 70px; height: 40px; background: #e74c3c; border-radius: 10px; animation: spin 0.8s infinite linear; box-shadow: 0 5px 10px rgba(0,0,0,0.5); }
        @keyframes spin { 100% { transform: rotateY(360deg); } }

        .etc-e { position: absolute; width: 18px; height: 18px; background: #f1c40f; border-radius: 50%; color: black; font-size: 10px; font-weight: bold; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 15px yellow; z-index: 10; opacity: 0; animation: eFlow 6s infinite linear; }
        @keyframes eFlow { 0%{left:3%; top:70%; opacity:0;} 5%{left:7%; top:55%; opacity:1;} 20%{left:26%; top:45%;} 40%{left:43%; top:48%;} 60%{left:60%; top:35%;} 80%{left:76%; top:50%;} 90%{left:83%; top:65%; opacity:1;} 95%{left:83%; top:65%; opacity:0;} 100%{opacity:0;} }

        .etc-h { position: absolute; background: var(--accent); color: white; padding: 4px 10px; border-radius: 15px; font-weight: bold; font-size: 1.1rem; z-index: 4; opacity: 0; transform: translate(-50%, -50%); box-shadow: 0 2px 5px rgba(0,0,0,0.5); border: 1px solid white; }
        .pump1 { left: 14%; animation: pumpH 6s infinite 1.2s; }
        .pump3 { left: 47%; animation: pumpH 6s infinite 3.6s; }
        .pump4 { left: 77%; animation: pumpH 6s infinite 5.4s; }
        @keyframes pumpH { 0%{top:70%; opacity:0;} 10%{top:60%; opacity:1;} 40%{top:15%; opacity:1;} 50%{top:5%; opacity:0;} 100%{opacity:0;} }

        .atp-fall { left: 91%; top: 5%; background: #00a8ff; color: white; position: absolute; padding: 4px 10px; border-radius: 15px; font-weight: bold; font-size: 1.1rem; opacity:0; animation: fallH 2.5s infinite; transform: translateX(-50%); box-shadow: 0 2px 5px rgba(0,0,0,0.5); border: 1px solid white; }
        @keyframes fallH { 0%{top:5%; opacity:0;} 20%{top:15%; opacity:1;} 80%{top:75%; opacity:1;} 100%{top:85%; opacity:0;} }
        
        .space-label { position: absolute; width: 100%; text-align: center; font-weight: bold; font-size: 1.5rem; color: #a4b0be; }

        /* 오른쪽 정보 패널 */
        .info-panel { flex: 1; min-width: 320px; background: var(--panel); border-radius: 15px; padding: 2rem; display: flex; flex-direction: column; box-shadow: 0 5px 15px rgba(0,0,0,0.3); border-top: 5px solid var(--primary); margin-bottom: 1rem; }
        .info-panel h3 { margin-top: 0; color: var(--primary); font-size: 1.6rem; border-bottom: 2px solid #555; padding-bottom: 1rem; }
        .info-row { margin-bottom: 1rem; font-size: 1.1rem; display: flex; align-items: flex-start; gap: 0.5rem; line-height: 1.4; }
        .badge { padding: 0.3rem 0.6rem; border-radius: 5px; font-size: 0.9rem; font-weight: bold; width: 85px; text-align: center; flex-shrink: 0; background: #111; border: 1px solid #555; }
        .desc-box { background: #222f3e; padding: 1.5rem; border-radius: 10px; font-size: 1.1rem; line-height: 1.6; color: #c8d6e5; margin-top: auto; border-left: 4px solid var(--primary); }
    </style>
</head>
<body>

    <header>
        <h1>대사과정 루이스 구조 & 분자 시뮬레이터</h1>
        <button class="home-btn" onclick="location.reload()">메뉴로 가기</button>
    </header>

    <div id="app">
        <!-- 1. 메인 메뉴 -->
        <div id="screen-main" class="screen active" style="align-items: center; justify-content: center; height: 100%; min-height: 70vh;">
            <div class="menu-grid">
                <div class="menu-card" onclick="startSim('glyco')">
                    <h2 style="color: var(--primary); margin-top:0;">해당과정 (Glycolysis)</h2>
                    <p style="color:#aaa;">1 ~ 10단계<br>포도당 분할</p>
                </div>
                <div class="menu-card" onclick="startSim('tca')">
                    <h2 style="color: var(--secondary); margin-top:0;">Link & TCA 회로</h2>
                    <p style="color:#aaa;">11 ~ 19단계<br>이산화탄소 방출</p>
                </div>
                <div class="menu-card" onclick="startSim('etc')">
                    <h2 style="color: var(--accent); margin-top:0;">산화적 인산화</h2>
                    <p style="color:#aaa;">20단계<br>전자전달계</p>
                </div>
            </div>
            <button style="margin-top:4rem; padding:1.2rem 4rem; font-size:1.3rem; cursor:pointer; background:var(--primary); color:white; border:none; border-radius:40px; font-weight:bold; box-shadow: 0 4px 15px rgba(15, 185, 177, 0.4);" onclick="startSim('all')">전체 20단계 연속 재생</button>
        </div>

        <!-- 2. 시뮬레이터 화면 -->
        <div id="screen-sim" class="screen">
            <div class="sim-header">
                <h2 id="sim-title" style="margin:0; color:var(--primary);">단계명</h2>
                <div class="progress-bar"><div class="progress-fill" id="sim-progress"></div></div>
                <span id="sim-counter" style="font-weight:bold; font-size:1.2rem; color:var(--primary);">1 / 20</span>
            </div>

            <div class="sim-body">
                <!-- 왼쪽: 시각화 영역 -->
                <div class="visual-area">
                    <div class="views-container">
                        <div id="anim-layer"></div>
                        
                        <!-- 화학 반응 구조식 뷰 -->
                        <div id="reaction-view" class="reaction-view">
                            <div class="mol-box" id="box-react">
                                <div class="mol-name" id="name-react">반응물</div>
                                <div class="mol-structure" id="struct-react"></div>
                            </div>

                            <div class="arrow-wrap">
                                <div class="enz-tag" id="enz-name">효소</div>
                                <div class="arrow-line">&#10230;</div>
                            </div>

                            <div class="mol-box" id="box-prod" style="opacity: 0.3;">
                                <div class="mol-name prod" id="name-prod">생성물</div>
                                <div class="mol-structure" id="struct-prod"></div>
                            </div>
                        </div>

                        <!-- 20단계 ETC 뷰 -->
                        <div id="etc-view">
                            <div class="space-label" style="top: 20px;">막간 공간 (H⁺ 고농도)</div>
                            <div class="membrane">
                                <div class="complex c-I">I<br><span style="font-size:11px; font-weight:normal;">FMN<br>FeS</span></div>
                                <div class="complex c-Q">Q</div>
                                <div class="complex c-II">II<br><span style="font-size:11px; font-weight:normal;">FAD</span></div>
                                <div class="complex c-III">III<br><span style="font-size:11px; font-weight:normal;">Cyt b</span></div>
                                <div class="complex c-CytC">C</div>
                                <div class="complex c-IV">IV<br><span style="font-size:11px; font-weight:normal;">Cyt a</span></div>
                                <div class="complex c-ATP">ATP<br>Synthase<div class="rotor"></div></div>
                            </div>
                            <div class="space-label" style="bottom: 20px;">미토콘드리아 기질 (H⁺ 저농도)</div>

                            <div class="etc-e">2e⁻</div>
                            <div class="etc-h pump1">4H⁺</div>
                            <div class="etc-h pump3">4H⁺</div>
                            <div class="etc-h pump4">2H⁺</div>
                            <div class="atp-fall">H⁺ 쏟아짐</div>
                            <div style="position:absolute; right:3%; bottom:10%; font-weight:bold; font-size:1.4rem; color:#f1c40f;">ADP + Pi → <span style="color:#e84118; font-size:1.8rem;">ATP</span></div>
                        </div>
                    </div>

                    <!-- 하단 네비게이션 고정바 -->
                    <div class="nav-controls" id="nav-controls" style="display: none;">
                        <button class="nav-btn" id="btn-prev" onclick="moveStep(-1)">&#8592; 이전</button>
                        <button class="nav-btn replay-btn" onclick="playCurrentAnimation()">다시 재생</button>
                        <button class="nav-btn" id="btn-next" onclick="moveStep(1)">다음 &#8594;</button>
                    </div>
                </div>

                <!-- 오른쪽: 정보 텍스트 패널 -->
                <div class="info-panel">
                    <h3 id="info-step-name">단계명</h3>
                    <div class="info-row"><span class="badge b-react" style="color:#00d2d3;">반응물</span><span id="info-react"></span></div>
                    <div class="info-row"><span class="badge b-prod" style="color:#10ac84;">생성물</span><span id="info-prod"></span></div>
                    <div class="info-row"><span class="badge b-enz" style="color:#feca57;">관여 효소</span><span id="info-enz"></span></div>
                    <div class="desc-box" id="info-desc">상세 설명</div>
                </div>
            </div>
        </div>
    </div>

<script>
    /* ----- 1. 수소(H) 생략 전혀 없는 완벽한 Grid-Flex 구조식 엔진 ----- */
    const A = (el, id='') => {
        let cls = 'atom ' + (['COO','CoA'].includes(el) ? 'group' : el.charAt(0));
        return `<div class="mol-c"><div class="${cls}" ${id ? `id="${id}"`:''}>${el}</div></div>`;
    };
    
    const C = (el, bonds, id='') => {
        let bHtml = bonds.split(' ').map(b => b ? `<div class="bond ${b}"></div>` : '').join('');
        return `<div class="mol-c">${bHtml}<div class="atom ${el}" ${id ? `id="${id}"`:''}>${el}</div></div>`;
    };
    
    const E = () => `<div class="mol-c"></div>`; 
    
    const Row = (l, c, r) => `<div class="m-row"><div class="mol-l">${l}</div>${c}<div class="mol-r">${r}</div></div>`;
    const VRow = (bond) => `<div class="m-vrow"><div class="mol-l"></div><div class="mol-c"><div class="bond ${bond}" style="position:relative;"></div></div><div class="mol-r"></div></div>`;

    // 좌우 결합 모듈 (수평 결합선)
    const H_left = `<div class="atom H">H</div><div class="bond h" style="position:relative; margin-left:-2px;"></div>`;
    const H_right = `<div class="bond h" style="position:relative; margin-right:-2px;"></div><div class="atom H">H</div>`;
    const HO_left = `<div class="atom H">H</div><div class="bond h" style="position:relative; width:8px;"></div><div class="atom O">O</div><div class="bond h" style="position:relative; width:12px; margin-left:-2px;"></div>`;
    const OH_right = `<div class="bond h" style="position:relative; width:12px; margin-right:-2px;"></div><div class="atom O">O</div><div class="bond h" style="position:relative; width:8px;"></div><div class="atom H">H</div>`;
    const P_left = `<div class="atom P">P</div><div class="bond h" style="position:relative; margin-left:-2px;"></div>`;
    const P_right = `<div class="bond h" style="position:relative; margin-right:-2px;"></div><div class="atom P">P</div>`;
    const P_target_right = `<div class="bond h" style="position:relative; margin-right:-2px;"></div><div class="atom P" id="target-p">P</div>`;

    function createAnimGroup(type, x, y) {
        const layer = document.getElementById('anim-layer');
        const div = document.createElement('div');
        div.className = `anim-group`;
        div.style.left = `${x}px`; div.style.top = `${y}px`;
        
        if(type === 'ATP') {
            div.innerHTML = `<div class="a-base a-ad">Ad</div><div style="display:flex;gap:2px;"><div class="p-ball">P</div><div class="p-ball">P</div><div class="p-ball" style="background:#e84118;color:white;">P</div></div>`;
        } else if(type === 'ADP' || type === 'GDP') {
            div.innerHTML = `<div class="a-base a-ad">${type === 'ADP' ? 'Ad':'Gu'}</div><div style="display:flex;gap:2px;"><div class="p-ball">P</div><div class="p-ball">P</div></div>`;
        } else if(type === 'NAD') {
            div.innerHTML = `<div class="a-base a-nad">NAD⁺</div>`;
        } else if(type === 'NADH') {
            div.innerHTML = `<div class="a-base a-nad" style="background:#20bf6b;">NADH + H⁺</div>`;
        } else if(type === 'FAD') {
            div.innerHTML = `<div class="a-base a-fad">FAD</div>`;
        } else if(type === 'FADH2') {
            div.innerHTML = `<div class="a-base a-fad" style="background:#20bf6b;">FADH₂</div>`;
        } else if(type === 'CoA') {
            div.innerHTML = `<div class="a-base a-coa">CoA</div>`;
        } else if(type === 'CO2') {
            div.innerHTML = `<div class="a-base a-co2">CO₂</div>`;
        } else if(type === 'H2O') {
            div.innerHTML = `<div class="a-base a-h2o">H₂O</div>`;
        } else if (type === 'O2') {
            div.innerHTML = `<div class="a-o2">O₂</div>`;
        }
        
        layer.appendChild(div);
        return div;
    }

    function createParticle(type, x, y) {
        const layer = document.getElementById('anim-layer');
        const div = document.createElement('div');
        div.className = `fly-${type}`;
        div.innerText = type === 'e' ? 'e⁻' : type === 'h' ? 'H⁺' : 'P';
        div.style.left = `${x}px`; div.style.top = `${y}px`;
        layer.appendChild(div);
        return div;
    }

        layer.innerHTML = '';
        
        const vArea = document.querySelector('.reaction-view').getBoundingClientRect();
        const startX = vArea.width * 0.25; 
        const midX = vArea.width * 0.5; 
        const prodX = vArea.width * 0.75;
        const topY = 40; 
        const midY = vArea.height * 0.5; 
        const botY = vArea.height - 40;

        const boxProd = document.getElementById('box-prod');
        boxProd.style.opacity = '0.3'; boxProd.style.transform = 'scale(0.9)';

        const finishAnim = () => { boxProd.style.opacity = '1'; boxProd.style.transform = 'scale(1)'; };

        if(data.anim === 'atp_to_adp') {
            let atp = createAnimGroup('ATP', midX, topY);
            atp.animate([{transform: 'translate(-50%, -80px)', opacity:0}, {transform: 'translate(-50%, 0)', opacity:1}], {duration:500, fill:'forwards'});
            
            setTimeout(() => {
                let targetP = document.getElementById('target-p');
                let targetX = prodX - 30; let targetY = midY;
                if(targetP) {
                    let r = targetP.getBoundingClientRect();
                    let containerRect = document.querySelector('.reaction-view').getBoundingClientRect();
                    targetX = r.left - containerRect.left + (r.width/2);
                    targetY = r.top - containerRect.top + (r.height/2);
                }

                let p = createParticle('p', midX + 40, topY);
                atp.innerHTML = `<div class="a-base a-ad">Ad</div><div style="display:flex;gap:2px;"><div class="p-ball">P</div><div class="p-ball">P</div></div>`; // ADP로 변신
                
                p.animate([{left:`${midX+40}px`, top:`${topY}px`}, {left:`${targetX}px`, top:`${targetY}px`}], {duration: 600, easing: 'ease-in-out', fill:'forwards'});
                atp.animate([{transform: 'translate(-50%, 0)', opacity:1}, {transform: 'translate(-50%, -80px)', opacity:0}], {duration:600, delay: 600, fill:'forwards'});
                
                setTimeout(() => { p.remove(); finishAnim(); }, 600);
            }, 800);
        }
        else if(data.anim === 'adp_to_atp' || data.anim === 'gdp_to_gtp') {
            let adp = createAnimGroup(data.anim==='adp_to_atp' ? 'ADP':'GDP', midX, topY);
            adp.animate([{transform: 'translate(-50%, -80px)', opacity:0}, {transform: 'translate(-50%, 0)', opacity:1}], {duration:500, fill:'forwards'});
            
            setTimeout(() => {
                let p = createParticle('p', startX+30, midY);
                p.animate([{left:`${startX+30}px`, top:`${midY}px`}, {left:`${midX+40}px`, top:`${topY}px`}], {duration: 600, easing: 'ease-in-out', fill:'forwards'});
                
                setTimeout(() => {
                    p.remove();
                    adp.innerHTML = `<div class="a-base a-ad">${data.anim==='adp_to_atp' ? 'Ad':'Gu'}</div><div style="display:flex;gap:2px;"><div class="p-ball">P</div><div class="p-ball">P</div><div class="p-ball" style="background:#e84118;color:white;">P</div></div>`; // ATP 변신
                    adp.animate([{transform: 'translate(-50%, 0)', opacity:1}, {transform: 'translate(-50%, -80px)', opacity:0}], {duration:600, delay: 400, fill:'forwards'});
                    finishAnim();
                }, 600);
            }, 800);
        }
        else if(data.anim.includes('nad_to_nadh') || data.anim.includes('fad_to_fadh2') || data.anim.includes('link_reaction')) {
            let isFAD = data.anim.includes('fad');
            let coenz = createAnimGroup(isFAD ? 'FAD' : 'NAD', midX, topY);
            coenz.animate([{transform: 'translate(-50%, -80px)', opacity:0}, {transform: 'translate(-50%, 0)', opacity:1}], {duration:500, fill:'forwards'});
            
            setTimeout(() => {
                // 전자 2개(2e-)와 수소 이온 2개(2H+) 생성
                let e1 = createParticle('e', startX+20, midY-15); let e2 = createParticle('e', startX+40, midY-15);
                let h1 = createParticle('h', startX+20, midY+15); let h2 = createParticle('h', startX+40, midY+15); 
                
                // e1, e2, h1은 조효소(NAD+/FAD) 안으로 흡수됨
                e1.animate([{left:`${startX+20}px`, top:`${midY-15}px`}, {left:`${midX-10}px`, top:`${topY}px`}], {duration:500, fill:'forwards'});
                e2.animate([{left:`${startX+40}px`, top:`${midY-15}px`}, {left:`${midX+10}px`, top:`${topY}px`}], {duration:500, fill:'forwards'});
                h1.animate([{left:`${startX+20}px`, top:`${midY+15}px`}, {left:`${midX+30}px`, top:`${topY}px`}], {duration:500, fill:'forwards'});
                
                // h2는 밖으로 튕겨져 나감 (2H+ 중 1개 방출 디테일)
                h2.animate([{left:`${startX+40}px`, top:`${midY+15}px`, opacity:1}, {left:`${midX+150}px`, top:`${botY-50}px`, opacity:0}], {duration:800, fill:'forwards'});

                if(data.anim === 'nad_to_nadh_p') {
                    let p = createParticle('p', midX, botY);
                    p.animate([{left:`${midX}px`, top:`${botY}px`, opacity:1}, {left:`${prodX-30}px`, top:`${midY}px`, opacity:1}], {duration:600, fill:'forwards'});
                    setTimeout(()=>p.remove(), 600);
                }

                if(data.anim.includes('co2') || data.anim.includes('link_reaction')) {
                    let co2 = createAnimGroup('CO2', startX+30, midY);
                    co2.animate([{opacity:1, transform:'translate(-50%, 0) scale(1)'}, {opacity:0, transform:'translate(30px, 80px) scale(0.5)'}], {duration:1000, fill:'forwards'});
                }

                if(data.anim.includes('link_reaction')) {
                    let coa = createAnimGroup('CoA', midX, botY);
                    coa.animate([{opacity:0, transform:'translate(-50%, 50px)'}, {opacity:1, transform:'translate(-50%, 0)'}, {opacity:0, transform:'translate(-120px, -80px)'}], {duration:1200, fill:'forwards'});
                }

                setTimeout(() => {
                    e1.remove(); e2.remove(); h1.remove(); // 흡수된 입자 삭제
                    coenz.innerHTML = `<div class="a-base ${isFAD ? 'a-fad':'a-nad'}" style="background:#20bf6b;">${isFAD ? 'FADH₂':'NADH + H⁺'}</div>`;
                    coenz.animate([{transform: 'translate(-50%, 0)', opacity:1}, {transform: 'translate(-50%, -80px)', opacity:0}], {duration:800, delay:400, fill:'forwards'});
                    finishAnim();
                }, 500);
            }, 800);
        }
        else if(data.anim === 'dehydration') {
            let h2o = createAnimGroup('H2O', startX+30, midY);
            h2o.animate([{opacity:1, transform:'translate(-50%, 0) scale(1)'}, {opacity:0, transform:'translate(0, 80px) scale(0.5)'}], {duration:1000, fill:'forwards'});
            setTimeout(finishAnim, 800);
        }
        else if(data.anim === 'hydration') {
            let h2o = createAnimGroup('H2O', midX, botY);
            h2o.animate([{opacity:0, transform:'translate(-50%, 50px)'}, {opacity:1, transform:'translate(-50%, 0)'}, {opacity:0, transform:'translate(-120px, -100px)'}], {duration:1200, fill:'forwards'});
            setTimeout(finishAnim, 800);
        }
        else if(data.anim === 'merge') {
            let coa = createAnimGroup('CoA', midX, midY);
            coa.animate([{opacity:1, transform:'translate(-50%, 0) scale(1)'}, {opacity:0, transform:'translate(50px, 80px) scale(0.5)'}], {duration:1000, fill:'forwards'});
            setTimeout(finishAnim, 800);
        }
        else {
            setTimeout(finishAnim, 600); // morph
        }
    }

    // ETC 20단계 전용 일회성 폭발 애니메이션
    function playETCAnimation() {
        const layer = document.getElementById('anim-layer');
        layer.innerHTML = '';

        const etcArea = document.getElementById('etc-view').getBoundingClientRect();
        
        // 1. NADH 산화 (Complex I)
        setTimeout(() => {
            let nadh = createAnimGroup('NADH', 100, etcArea.height - 40);
            nadh.animate([{opacity:0, transform:'translateY(20px)'}, {opacity:1, transform:'translateY(0)'}], {duration:500, fill:'forwards'});
            
            setTimeout(() => {
                let e1 = createParticle('e', 100, etcArea.height - 40);
                let e2 = createParticle('e', 110, etcArea.height - 40);
                let h1 = createParticle('h', 90, etcArea.height - 40);
                let h2 = createParticle('h', 120, etcArea.height - 40);

                e1.animate([{left:'100px', top:`${etcArea.height - 40}px`}, {left:'100px', top:`${etcArea.height/2}px`}], {duration:800, fill:'forwards'});
                e2.animate([{left:'110px', top:`${etcArea.height - 40}px`}, {left:'110px', top:`${etcArea.height/2}px`}], {duration:800, fill:'forwards'});
                
                h1.animate([{left:'90px', top:`${etcArea.height - 40}px`}, {left:'90px', top:`${etcArea.height/2}px`}], {duration:800, fill:'forwards'});
                h2.animate([{left:'120px', top:`${etcArea.height - 40}px`}, {left:'120px', top:`${etcArea.height/2}px`}], {duration:800, fill:'forwards'});

                nadh.innerHTML = `<div class="a-base a-nad">NAD⁺</div>`;
                nadh.animate([{opacity:1}, {opacity:0, transform:'translateY(20px)'}], {duration:500, delay: 500, fill:'forwards'});

                setTimeout(() => { e1.remove(); e2.remove(); h1.remove(); h2.remove(); nadh.remove(); }, 1000);
            }, 600);
        }, 500);

        // 2. FADH2 산화 (Complex II)
        setTimeout(() => {
            let fadh2 = createAnimGroup('FADH2', 250, etcArea.height - 30);
            fadh2.animate([{opacity:0, transform:'translateY(20px)'}, {opacity:1, transform:'translateY(0)'}], {duration:500, fill:'forwards'});
            
            setTimeout(() => {
                let e1 = createParticle('e', 250, etcArea.height - 30);
                let e2 = createParticle('e', 260, etcArea.height - 30);
                let h1 = createParticle('h', 240, etcArea.height - 30);
                let h2 = createParticle('h', 270, etcArea.height - 30);

                e1.animate([{left:'250px', top:`${etcArea.height - 30}px`}, {left:'250px', top:`${etcArea.height/2 + 20}px`}], {duration:800, fill:'forwards'});
                e2.animate([{left:'260px', top:`${etcArea.height - 30}px`}, {left:'260px', top:`${etcArea.height/2 + 20}px`}], {duration:800, fill:'forwards'});
                
                h1.animate([{left:'240px', top:`${etcArea.height - 30}px`}, {left:'240px', top:`${etcArea.height/2 + 20}px`}], {duration:800, fill:'forwards'});
                h2.animate([{left:'270px', top:`${etcArea.height - 30}px`}, {left:'270px', top:`${etcArea.height/2 + 20}px`}], {duration:800, fill:'forwards'});

                fadh2.innerHTML = `<div class="a-base a-fad">FAD</div>`;
                fadh2.animate([{opacity:1}, {opacity:0, transform:'translateY(20px)'}], {duration:500, delay: 500, fill:'forwards'});

                setTimeout(() => { e1.remove(); e2.remove(); h1.remove(); h2.remove(); fadh2.remove(); }, 1000);
            }, 600);
        }, 2500);

        // 3. 최종 전자 수용체 산소 결합 (Complex IV -> H2O)
        setTimeout(() => {
            let o2 = createAnimGroup('O2', etcArea.width * 0.8, etcArea.height - 40);
            o2.animate([{opacity:0, transform:'scale(0.5)'}, {opacity:1, transform:'scale(1)'}], {duration:500, fill:'forwards'});

            setTimeout(() => {
                let e1 = createParticle('e', etcArea.width * 0.77, etcArea.height/2);
                let e2 = createParticle('e', etcArea.width * 0.79, etcArea.height/2);
                let h1 = createParticle('h', etcArea.width * 0.85, etcArea.height/2);
                let h2 = createParticle('h', etcArea.width * 0.87, etcArea.height/2);

                e1.animate([{top:`${etcArea.height/2}px`, opacity:1}, {top:`${etcArea.height - 40}px`, opacity:0}], {duration:800, fill:'forwards'});
                e2.animate([{top:`${etcArea.height/2}px`, opacity:1}, {top:`${etcArea.height - 40}px`, opacity:0}], {duration:800, fill:'forwards'});
                h1.animate([{top:`${etcArea.height/2}px`, opacity:1}, {left:`${etcArea.width * 0.8}px`, top:`${etcArea.height - 40}px`, opacity:0}], {duration:800, fill:'forwards'});
                h2.animate([{top:`${etcArea.height/2}px`, opacity:1}, {left:`${etcArea.width * 0.8}px`, top:`${etcArea.height - 40}px`, opacity:0}], {duration:800, fill:'forwards'});

                setTimeout(() => {
                    o2.innerHTML = `<div class="a-base a-h2o">H₂O</div>`;
                    o2.animate([{transform:'scale(1)'}, {transform:'translateY(30px) scale(0.5)', opacity:0}], {duration:1000, delay: 500, fill:'forwards'});
                }, 800);
            }, 600);
        }, 5000);
    }

    /* ----- 4. 페이지 컨트롤러 ----- */
    function goHome() {
        document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
        document.getElementById('nav-controls').style.display = 'none';
        document.getElementById('screen-main').classList.add('active');
    }

    function startSim(scope) {
        if (scope === 'glyco') currentProcess = DB.slice(0, 10);
        else if (scope === 'tca') currentProcess = DB.slice(10, 19);
        else if (scope === 'etc') currentProcess = DB.slice(19, 20);
        else currentProcess = DB;
        
        currentIndex = 0;
        document.getElementById('screen-main').classList.remove('active');
        document.getElementById('screen-sim').classList.add('active');
        document.getElementById('nav-controls').style.display = 'flex'; 
        updateUI();
    }

    function moveStep(dir) {
        currentIndex += dir;
        if (currentIndex < 0) currentIndex = 0;
        if (currentIndex >= currentProcess.length) currentIndex = currentProcess.length - 1;
        updateUI();
    }

    function updateUI() {
        const data = currentProcess[currentIndex];
        
        document.getElementById('sim-title').innerText = data.phase;
        document.getElementById('sim-counter').innerText = `${currentIndex + 1} / ${currentProcess.length}`;
        document.getElementById('sim-progress').style.width = `${((currentIndex + 1) / currentProcess.length) * 100}%`;
        
        document.getElementById('info-step-name').innerText = data.name;
        document.getElementById('info-react').innerText = data.react;
        document.getElementById('info-prod').innerText = data.prod;
        document.getElementById('info-enz').innerText = data.enz.replace(/\n/g, ' ');
        document.getElementById('info-desc').innerText = data.desc;

        if (data.step === 20) {
            document.getElementById('reaction-view').style.display = 'none';
            document.getElementById('etc-view').style.display = 'block';
            playETCAnimation();
        } else {
            document.getElementById('reaction-view').style.display = 'flex';
            document.getElementById('etc-view').style.display = 'none';

            document.getElementById('name-react').innerText = data.react;
            document.getElementById('name-prod').innerText = data.prod;
            document.getElementById('struct-react').innerHTML = data.strR;
            document.getElementById('struct-prod').innerHTML = data.strP;
            document.getElementById('enz-name').innerText = data.enz;

            playCurrentAnimation();
        }

        document.getElementById('btn-prev').disabled = (currentIndex === 0);
        document.getElementById('btn-next').disabled = (currentIndex === currentProcess.length - 1);
    }
</script>
