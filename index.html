<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>세포호흡 상세 구조식 시뮬레이터</title>
    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #16a085;
            --accent: #e74c3c;
            --bg: #f8f9fa;
        }
        * { box-sizing: border-box; font-family: 'Pretendard', Consolas, monospace; }
        body { margin: 0; padding: 0; background: var(--bg); display: flex; flex-direction: column; height: 100vh; }
        header { background: var(--primary); color: white; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { margin: 0; font-size: 1.5rem; font-family: sans-serif; }
        .home-btn { background: rgba(255,255,255,0.2); color: white; border: none; padding: 0.5rem 1rem; border-radius: 5px; cursor: pointer; font-weight: bold; font-family: sans-serif; }

        /* 메인 컨텐츠 영역 */
        #app-content { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 2rem; overflow-y: auto; }
        .screen { display: none; width: 100%; max-width: 1200px; flex-direction: column; animation: fadeIn 0.4s; }
        .screen.active { display: flex; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* 메뉴 */
        .menu-grid { display: flex; gap: 1.5rem; justify-content: center; margin-top: 2rem; font-family: sans-serif; }
        .menu-card { background: white; padding: 2rem; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); text-align: center; cursor: pointer; border: 2px solid transparent; transition: 0.2s; width: 250px; }
        .menu-card:hover { border-color: var(--primary); transform: translateY(-5px); }

        /* 시뮬레이터 내부 레이아웃 */
        .sim-header { background: white; padding: 1rem 2rem; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; box-shadow: 0 2px 5px rgba(0,0,0,0.05); font-family: sans-serif; }
        .progress-bar { flex: 1; height: 8px; background: #eee; margin: 0 2rem; border-radius: 4px; }
        .progress-fill { height: 100%; background: var(--secondary); width: 0%; transition: 0.3s; }
        
        .sim-body { display: flex; gap: 2rem; background: white; padding: 2rem; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); min-height: 550px; flex-wrap: wrap; }
        
        .nav-controls { width: 100%; display: flex; justify-content: space-between; margin-bottom: 1rem; }
        .nav-btn { width: 50px; height: 50px; border-radius: 50%; border: 2px solid #ccc; background: white; font-size: 1.5rem; cursor: pointer; transition: 0.2s; }
        .nav-btn:hover:not(:disabled) { background: var(--primary); color: white; border-color: var(--primary); }

        /* 시각화 영역 (구조식) */
        .visual-area { flex: 2; min-width: 600px; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #fff; border: 2px solid #eee; border-radius: 10px; padding: 2rem; position: relative; }
        
        /* 루이스 구조식 렌더러 */
        .reaction-container { display: flex; align-items: center; justify-content: center; gap: 1rem; width: 100%; }
        .molecule-wrapper { display: flex; flex-direction: column; align-items: center; }
        .struct-box { background: #fdfdfd; border: 1px solid #ddd; padding: 1.5rem; border-radius: 10px; font-size: 1.1rem; line-height: 1.2; letter-spacing: 2px; text-align: center; white-space: pre; position: relative; min-width: 200px; min-height: 250px; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 0 10px rgba(0,0,0,0.02); }
        .mol-name { margin-top: 1rem; font-weight: bold; font-family: sans-serif; color: var(--primary); background: #eee; padding: 0.3rem 1rem; border-radius: 15px; }
        
        /* 반응 화살표 및 효소 */
        .arrow-wrap { display: flex; flex-direction: column; align-items: center; position: relative; padding: 0 1rem; }
        .arrow-line { font-size: 3rem; color: #aaa; margin: -10px 0; }
        .enz-tag { background: #f1c40f; color: #333; padding: 0.4rem 0.8rem; border-radius: 20px; font-size: 0.9rem; font-weight: bold; text-align: center; max-width: 150px; white-space: pre-wrap; font-family: sans-serif; }

        /* 애니메이션 하이라이트 클래스 */
        .highlight { color: var(--accent); font-weight: bold; }
        .highlight-p { color: var(--secondary); font-weight: bold; }

        /* 정보 패널 */
        .info-panel { flex: 1; min-width: 300px; background: #fafbfc; padding: 2rem; border-radius: 10px; border-left: 4px solid var(--primary); font-family: sans-serif; }
        .info-panel h3 { margin-top: 0; color: var(--primary); font-size: 1.4rem; border-bottom: 2px solid #ddd; padding-bottom: 0.5rem; }
        .info-row { margin-bottom: 1rem; font-size: 1.05rem; line-height: 1.5; }
        .badge { display: inline-block; padding: 0.2rem 0.5rem; border-radius: 5px; font-size: 0.85rem; font-weight: bold; margin-right: 10px; width: 70px; text-align: center; }
        .b-react { background: #e0f7fa; color: #006064; }
        .b-prod { background: #e8f5e9; color: #1b5e20; }
        .b-enz { background: #fff9c4; color: #f57f17; }
        
        /* 조효소 애니메이션 태그 */
        .coenz-anim { position: absolute; font-weight: bold; font-family: sans-serif; font-size: 1rem; opacity: 0; pointer-events: none; }
        .coenz-in { color: #d35400; top: 10%; left: 50%; transform: translateX(-50%); animation: dropIn 2s forwards; }
        .coenz-out { color: #2980b9; bottom: 10%; left: 50%; transform: translateX(-50%); animation: dropOut 2s forwards 0.5s; }
        @keyframes dropIn { 0%{opacity:0; transform:translate(-50%, -20px);} 20%{opacity:1;} 100%{opacity:0; transform:translate(-50%, 20px);} }
        @keyframes dropOut { 0%{opacity:0; transform:translate(-50%, 0);} 20%{opacity:1;} 100%{opacity:0; transform:translate(-50%, 40px);} }

    </style>
</head>
<body>

    <header>
        <h1>대사과정 구조식 뷰어</h1>
        <button class="home-btn" onclick="goHome()">메뉴로 돌아가기</button>
    </header>

    <div id="app-content">
        <!-- 메인 메뉴 -->
        <div id="screen-main" class="screen active" style="align-items: center;">
            <h2 style="font-family: sans-serif;">학습할 파트를 선택하세요</h2>
            <div class="menu-grid">
                <div class="menu-card" onclick="startSim('glyco')">
                    <h3 style="color: var(--primary);">해당과정</h3>
                    <p>1~10단계 (세포질)</p>
                </div>
                <div class="menu-card" onclick="startSim('tca')">
                    <h3 style="color: var(--secondary);">Link & TCA 회로</h3>
                    <p>11~19단계 (기질)</p>
                </div>
            </div>
        </div>

        <!-- 시뮬레이터 -->
        <div id="screen-sim" class="screen">
            <div class="sim-header">
                <h2 id="sim-title" style="margin:0; color:var(--primary);">단계 이름</h2>
                <div class="progress-bar"><div class="progress-fill" id="sim-progress"></div></div>
                <span id="sim-counter" style="font-weight:bold;">1 / 19</span>
            </div>
            
            <div class="nav-controls">
                <button class="nav-btn" id="btn-prev" onclick="moveStep(-1)">&#8592;</button>
                <button class="nav-btn" id="btn-next" onclick="moveStep(1)">&#8594;</button>
            </div>

            <div class="sim-body">
                <!-- 시각화 영역 -->
                <div class="visual-area">
                    <div class="reaction-container">
                        <!-- 반응물 -->
                        <div class="molecule-wrapper">
                            <div class="struct-box" id="struct-react"></div>
                            <div class="mol-name" id="name-react">반응물</div>
                        </div>

                        <!-- 화살표 및 효소 -->
                        <div class="arrow-wrap">
                            <div class="coenz-anim coenz-in" id="anim-in"></div>
                            <div class="enz-tag" id="enz-name">효소</div>
                            <div class="arrow-line">&#10230;</div>
                            <div class="coenz-anim coenz-out" id="anim-out"></div>
                        </div>

                        <!-- 생성물 -->
                        <div class="molecule-wrapper">
                            <div class="struct-box" id="struct-prod"></div>
                            <div class="mol-name" id="name-prod">생성물</div>
                        </div>
                    </div>
                </div>

                <!-- 텍스트 정보 -->
                <div class="info-panel">
                    <h3 id="info-step-name" style="font-family: sans-serif;">단계명</h3>
                    <div class="info-row"><span class="badge b-react">반응물</span><span id="info-react"></span></div>
                    <div class="info-row"><span class="badge b-prod">생성물</span><span id="info-prod"></span></div>
                    <div class="info-row"><span class="badge b-enz">효소</span><span id="info-enz"></span></div>
                    <div style="background: white; padding: 1rem; border-radius: 10px; border-left: 4px solid var(--accent); margin-top: 1rem; font-size: 1rem;" id="info-desc">설명</div>
                </div>
            </div>
        </div>
    </div>

<script>
    // 구조식 데이터 (Pre 렌더링용 텍스트. 강조할 부분은 <span> 처리)
    // P는 ℗ 로 표현, 강조는 <span class='highlight'> 로 래핑.
    const structDB = {
        glucose: "  H O\n  | //\n  C\n  |\nH-C-OH\n  |\nHO-C-H\n  |\nH-C-OH\n  |\nH-C-OH\n  |\n  CH2OH",
        g6p: "  H O\n  | //\n  C\n  |\nH-C-OH\n  |\nHO-C-H\n  |\nH-C-OH\n  |\nH-C-OH\n  |\n  CH2O-<span class='highlight-p'>℗</span>",
        f6p: "  CH2OH\n  |\n  C=O\n  |\nHO-C-H\n  |\nH-C-OH\n  |\nH-C-OH\n  |\n  CH2O-℗",
        f16bp: "<span class='highlight-p'>℗</span>-O-CH2\n  |\n  C=O\n  |\nHO-C-H\n  |\nH-C-OH\n  |\nH-C-OH\n  |\n  CH2O-℗",
        dhap: "  CH2O-℗\n  |\n  C=O\n  |\n  CH2OH",
        g3p: "  H O\n  | //\n  C\n  |\nH-C-OH\n  |\n  CH2O-℗",
        bpg13: "  <span class='highlight-p'>℗</span>-O O\n   \\//\n    C\n    |\n  H-C-OH\n    |\n    CH2O-℗",
        pg3: "  O- O\n   \\//\n    C\n    |\n  H-C-OH\n    |\n    CH2O-℗",
        pg2: "  O- O\n   \\//\n    C\n    |\n  H-C-O-<span class='highlight-p'>℗</span>\n    |\n    CH2OH",
        pep: "  O- O\n   \\//\n    C\n    |\n    C-O-℗\n   //\n  CH2",
        pyruvate: "  O- O\n   \\//\n    C\n    |\n    C=O\n    |\n   CH3",
        acetyl: "   O\n  //\n  C-S-CoA\n  |\n CH3",
        citrate: "   CH2-COO-\n   |\nHO-C-COO-\n   |\n   CH2-COO-",
        isocitrate: "   CH2-COO-\n   |\n H-C-COO-\n   |\nHO-C-COO-\n   |",
        akg: "   CH2-COO-\n   |\n   CH2\n   |\n   C=O\n   |\n   COO-",
        succinyl: "   CH2-COO-\n   |\n   CH2\n   |\n   C=O\n   |\n   S-CoA",
        succinate: "   CH2-COO-\n   |\n   CH2-COO-",
        fumarate: " -OOC-C-H\n      ||\n    H-C-COO-",
        malate: "   COO-\n   |\nHO-C-H\n   |\n   CH2-COO-",
        oxaloacetate: "   COO-\n   |\n   C=O\n   |\n   CH2-COO-"
    };

    const DB = [
        { step: 1, phase: '해당과정 (Phase 1)', name: '1. 포도당 인산화', react: 'Glucose', prod: 'G6P', strR: structDB.glucose, strP: structDB.g6p, enz: 'Hexokinase', in: '+ ATP', out: '+ ADP', desc: 'ATP의 인산기를 포도당 6번 탄소에 결합시켜 세포 밖으로 나가지 못하게 합니다.' },
        { step: 2, phase: '해당과정 (Phase 1)', name: '2. 이성질체화', react: 'G6P', prod: 'F6P', strR: structDB.g6p, strP: structDB.f6p, enz: 'Phosphoglucose\nisomerase', in: '', out: '구조 재배열', desc: '1번 탄소가 밖으로 노출되도록 알도오스를 케토오스로 구조를 변형(이성질화)시킵니다.' },
        { step: 3, phase: '해당과정 (Phase 1)', name: '3. 두 번째 인산화', react: 'F6P', prod: 'F1,6BP', strR: structDB.f6p, strP: structDB.f16bp, enz: 'PFK-1', in: '+ ATP', out: '+ ADP', desc: '1번 탄소에 인산기를 추가로 붙여 완벽한 대칭 구조를 만듭니다.' },
        { step: 4, phase: '해당과정 (Phase 1)', name: '4. 분할 (Cleavage)', react: 'F1,6BP', prod: 'DHAP + G3P', strR: structDB.f16bp, strP: structDB.dhap + "\n\n  +\n\n" + structDB.g3p, enz: 'Aldolase', in: '', out: '분할', desc: '6탄소 당을 두 개의 3탄소 화합물로 정확히 자릅니다.' },
        { step: 5, phase: '해당과정 (Phase 1)', name: '5. 상호 전환', react: 'DHAP', prod: 'G3P', strR: structDB.dhap, strP: structDB.g3p, enz: 'Triose phosphate\nisomerase', in: '', out: '구조 변화', desc: 'DHAP를 모두 G3P로 전환합니다. (이후 모든 반응 x2)' },
        { step: 6, phase: '해당과정 (Phase 2)', name: '6. 산화 및 인산화', react: 'G3P', prod: '1,3-BPG', strR: structDB.g3p, strP: structDB.bpg13, enz: 'G3P\ndehydrogenase', in: '+ NAD⁺, Pi', out: '+ NADH + H⁺', desc: '수소와 전자(2e⁻)를 추출하여 NADH를 생성하고 무기인산을 결합시킵니다.' },
        { step: 7, phase: '해당과정 (Phase 2)', name: '7. 첫 ATP 생성', react: '1,3-BPG', prod: '3PG', strR: structDB.bpg13, strP: structDB.pg3, enz: 'Phosphoglycerate\nkinase', in: '+ ADP', out: '+ ATP', desc: '1번 탄소의 인산기를 ADP에 넘겨주어 ATP를 합성합니다. (기질수준 인산화)' },
        { step: 8, phase: '해당과정 (Phase 2)', name: '8. 인산기 이동', react: '3PG', prod: '2PG', strR: structDB.pg3, strP: structDB.pg2, enz: 'Phosphoglycerate\nmutase', in: '', out: '인산기 이동', desc: '인산기 위치를 3번에서 2번 탄소로 옮겨 에너지를 불안정하게 만듭니다.' },
        { step: 9, phase: '해당과정 (Phase 2)', name: '9. 탈수 반응', react: '2PG', prod: 'PEP', strR: structDB.pg2, strP: structDB.pep, enz: 'Enolase', in: '', out: '+ H₂O 이탈', desc: '물 분자(H₂O)를 떼어내 이중결합을 형성, 인산기 결합 에너지를 폭발적으로 높입니다.' },
        { step: 10, phase: '해당과정 (Phase 2)', name: '10. 두 번째 ATP', react: 'PEP', prod: 'Pyruvate', strR: structDB.pep, strP: structDB.pyruvate, enz: 'Pyruvate\nkinase', in: '+ ADP', out: '+ ATP', desc: '마지막 인산기를 떼어내어 ATP를 만들고 최종 산물인 피루브산을 생성합니다.' },
        
        { step: 11, phase: '바탕질 진입', name: '11. 연결 반응', react: 'Pyruvate', prod: 'Acetyl-CoA', strR: structDB.pyruvate, strP: structDB.acetyl, enz: 'Pyruvate\ndehydrogenase\n(TPP, lipoate, FAD)', in: '+ CoA, NAD⁺', out: '+ CO₂, NADH+H⁺', desc: '피루브산에서 CO₂를 떼어내고, 조효소 A를 붙여 TCA 진입을 준비합니다.' },
        { step: 12, phase: 'TCA 회로', name: '12. 시트르산 합성', react: 'Acetyl-CoA + OAA', prod: 'Citrate', strR: structDB.acetyl + "\n  +\n" + structDB.oxaloacetate, strP: structDB.citrate, enz: 'Citrate\nsynthase', in: '+ H₂O', out: 'CoA 탈락', desc: '2탄소 아세틸기와 4탄소 옥살로아세트산이 결합해 6탄소 시트르산이 됩니다.' },
        { step: 13, phase: 'TCA 회로', name: '13. 이성질체화', react: 'Citrate', prod: 'Isocitrate', strR: structDB.citrate, strP: structDB.isocitrate, enz: 'Aconitase', in: '', out: '-OH기 이동', desc: '탈수/수화 반응을 통해 히드록시기의 위치를 바꿉니다.' },
        { step: 14, phase: 'TCA 회로', name: '14. 1차 산화', react: 'Isocitrate', prod: 'α-KG', strR: structDB.isocitrate, strP: structDB.akg, enz: 'Isocitrate\ndehydrogenase', in: '+ NAD⁺', out: '+ CO₂, NADH+H⁺', desc: '첫 번째 CO₂가 방출되며 고에너지 전자(NADH)가 추출됩니다.' },
        { step: 15, phase: 'TCA 회로', name: '15. 2차 산화', react: 'α-KG', prod: 'Succinyl-CoA', strR: structDB.akg, strP: structDB.succinyl, enz: 'α-KG\ndehydrogenase', in: '+ CoA, NAD⁺', out: '+ CO₂, NADH+H⁺', desc: '마지막 CO₂가 방출되며 두 번째 NADH를 뽑아냅니다.' },
        { step: 16, phase: 'TCA 회로', name: '16. 기질 인산화', react: 'Succinyl-CoA', prod: 'Succinate', strR: structDB.succinyl, strP: structDB.succinate, enz: 'Succinyl-CoA\nsynthetase', in: '+ GDP, Pi', out: '+ GTP(ATP)', desc: '조효소 A가 떨어지는 에너지를 이용하여 GTP(ATP)를 생성합니다.' },
        { step: 17, phase: 'TCA 회로', name: '17. FADH₂ 생성', react: 'Succinate', prod: 'Fumarate', strR: structDB.succinate, strP: structDB.fumarate, enz: 'Succinate\ndehydrogenase', in: '+ FAD', out: '+ FADH₂', desc: '내막 효소에 의해 전자가 추출되어 FADH₂가 생성되고 이중결합이 형성됩니다.' },
        { step: 18, phase: 'TCA 회로', name: '18. 수화 반응', react: 'Fumarate', prod: 'Malate', strR: structDB.fumarate, strP: structDB.malate, enz: 'Fumarase', in: '+ H₂O', out: '결합 형성', desc: '이중결합에 물 분자가 첨가되어 말산으로 변합니다.' },
        { step: 19, phase: 'TCA 회로', name: '19. OAA 재생', react: 'Malate', prod: 'Oxaloacetate', strR: structDB.malate, strP: structDB.oxaloacetate, enz: 'Malate\ndehydrogenase', in: '+ NAD⁺', out: '+ NADH+H⁺', desc: '마지막 전자를 빼앗아 NADH를 만들고, 옥살로아세트산을 완벽히 재생시킵니다.' }
    ];

    let currentProcess = [];
    let currentIndex = 0;

    function goHome() {
        document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
        document.getElementById('screen-main').classList.add('active');
    }

    function startSim(scope) {
        if (scope === 'glyco') currentProcess = DB.slice(0, 10);
        else if (scope === 'tca') currentProcess = DB.slice(10, 19);
        else currentProcess = DB;
        
        currentIndex = 0;
        document.getElementById('screen-main').classList.remove('active');
        document.getElementById('screen-sim').classList.add('active');
        updateUI();
    }

    function triggerCoenzAnim(inTxt, outTxt) {
        const inEl = document.getElementById('anim-in');
        const outEl = document.getElementById('anim-out');
        
        inEl.style.animation = 'none'; outEl.style.animation = 'none';
        void inEl.offsetWidth; // 리플로우

        if(inTxt) {
            inEl.innerHTML = inTxt;
            inEl.style.animation = 'dropIn 1.5s forwards';
        } else { inEl.innerHTML = ''; }
        
        if(outTxt) {
            outEl.innerHTML = outTxt;
            outEl.style.animation = 'dropOut 1.5s forwards 0.5s';
        } else { outEl.innerHTML = ''; }
    }

    function moveStep(dir) {
        currentIndex += dir;
        if (currentIndex < 0) currentIndex = 0;
        if (currentIndex >= currentProcess.length) currentIndex = currentProcess.length - 1;
        updateUI();
    }

    function updateUI() {
        const data = currentProcess[currentIndex];
        
        // 헤더
        document.getElementById('sim-title').innerText = data.phase;
        document.getElementById('sim-counter').innerText = `${currentIndex + 1} / ${currentProcess.length}`;
        document.getElementById('sim-progress').style.width = `${((currentIndex + 1) / currentProcess.length) * 100}%`;
        
        // 구조식 렌더링
        document.getElementById('name-react').innerText = data.react;
        document.getElementById('name-prod').innerText = data.prod;
        document.getElementById('struct-react').innerHTML = data.strR;
        document.getElementById('struct-prod').innerHTML = data.strP;
        document.getElementById('enz-name').innerText = data.enz;

        triggerCoenzAnim(data.in, data.out);

        // 정보 텍스트
        document.getElementById('info-step-name').innerText = data.name;
        document.getElementById('info-react').innerText = data.react;
        document.getElementById('info-prod').innerText = data.prod;
        document.getElementById('info-enz').innerText = data.enz.replace(/\n/g, ' ');
        document.getElementById('info-desc').innerText = data.desc;

        // 버튼 상태
        document.getElementById('btn-prev').disabled = (currentIndex === 0);
        document.getElementById('btn-next').disabled = (currentIndex === currentProcess.length - 1);
    }
</script>
</body>
</html>
